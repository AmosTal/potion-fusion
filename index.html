  CX.save();
  CX.translate(W / 2, by + bh / 2); CX.scale(pulse, pulse); CX.translate(-W / 2, -(by + bh / 2));
  if (offerX2) {
    const xw = 92, gw = bw - xw - 12, gx = bx + xw + 12;
    CX.save();
    CX.shadowColor = '#ffb42e'; CX.shadowBlur = 14;
    chunkyCapsule(bx, by, xw, bh, 24, '#ffd23f', '#ff9f2e', '#a86200');
    CX.restore();
    CX.fillStyle = '#ffffff';
    CX.beginPath();
    CX.moveTo(bx + 18, by + 19); CX.lineTo(bx + 30, by + 26); CX.lineTo(bx + 18, by + 33);
    CX.closePath(); CX.fill();
    outlinedText('×2', bx + 52, by + 32, 19, '#ffffff', '#fff3cf', 'rgba(120,60,0,0.92)', 'left');
    CX.font = fnt(800, 9); CX.fillStyle = 'rgba(120,60,0,0.85)';
    CX.textAlign = 'center'; CX.fillText('AD', bx + 25, by + 45);
    CX.save();
    CX.shadowColor = '#3ddc84'; CX.shadowBlur = 16;
    chunkyCapsule(gx, by, gw, bh, 24, '#7ce75a', '#34b24a', '#166e2c');
    CX.restore();
    outlinedText('COLLECT +' + wd.total, gx + gw / 2, by + 33, 17, '#ffffff', '#e2ffe6', 'rgba(10,70,26,0.92)');
    G._winBtns = { x2: { x: bx, y: by, w: xw, h: bh } };
  } else {
    CX.save();
    CX.shadowColor = '#3ddc84'; CX.shadowBlur = 16;
    chunkyCapsule(bx, by, bw, bh, 26, '#7ce75a', '#34b24a', '#166e2c');
    CX.restore();
    outlinedText(wd.granted ? 'NEXT LEVEL  ▶' : 'COLLECT  +' + wd.total, W / 2, by + 33, 18, '#ffffff', '#e2ffe6', 'rgba(10,70,26,0.92)');
    G._winBtns = null;
  }
  CX.restore();
  CX.restore();
}

/* ---------- aquarium: state, food economy ---------- */
const AQ = store.get('aquarium', null) || { food: 0, fish: [], seen: [], best: {} };
if (!AQ.seen) AQ.seen = [];
if (!AQ.best) AQ.best = {};      // species index -> biggest cm ever raised
if (!AQ.decor) AQ.decor = [];    // ornament ids bought for the current tank
if (AQ.tank == null) AQ.tank = 0;
if (AQ.tanksDone == null) AQ.tanksDone = 0;
if (AQ.starsSeen == null) AQ.starsSeen = 0;
function saveAq() { store.set('aquarium', AQ); }
/* v2.8 fish economy: species drop weights (live-tunable per species) and the
 * hunger clock. Fish remember when they last ate; skip feeding for long
 * enough and they get hungry, then starving, then they swim away. */
const FISHCFG = { weights: null, hungryH: 24, starveH: 48, loseH: 72, lossOn: true };
/* v2.9 THE TANK CHASE — replaces the old daily coin dividend.
 * Genre research (Fishdom/Gardenscapes and the casual-puzzle meta at large):
 * the aquarium should be a coin SINK the player invests in, not a faucet that
 * pays out while they are away. Passive income is an idle-game mechanic; here
 * the loop is play -> earn -> DECORATE -> the tank visibly improves -> stars
 * -> a brand-new tank to beautify. Short goal: the next ornament. Medium: the
 * next star. Long: finish this tank and unlock the next one. */
// `y` is the ornament's base as a fraction of tank height — the floor sits
// above the bottom button row so nothing important hides behind the UI.
const DECOR = [
  { id: 'weed',    name: 'Kelp Cluster',   cost: 60,   beauty: 15,  y: 0.82 },
  { id: 'rock',    name: 'Rock Cairn',     cost: 110,  beauty: 28,  y: 0.83 },
  { id: 'coral',   name: 'Coral Fan',      cost: 180,  beauty: 46,  y: 0.80 },
  { id: 'shell',   name: 'Giant Clam',     cost: 260,  beauty: 68,  y: 0.83 },
  { id: 'ring',    name: 'Bubble Ring',    cost: 320,  beauty: 84,  y: 0.50 },
  { id: 'amphora', name: 'Greek Amphora',  cost: 420,  beauty: 112, y: 0.81 },
  { id: 'lantern', name: 'Deep Lantern',   cost: 520,  beauty: 140, y: 0.42 },
  { id: 'column',  name: 'Broken Column',  cost: 650,  beauty: 178, y: 0.80 },
  { id: 'chest',   name: 'Treasure Chest', cost: 820,  beauty: 226, y: 0.83 },
  { id: 'ship',    name: 'Sunken Ship',    cost: 1100, beauty: 310, y: 0.79 },
  { id: 'arch',    name: 'Coral Arch',     cost: 1500, beauty: 430, y: 0.74 },
  { id: 'statue',  name: 'Fish Statue',    cost: 2000, beauty: 580, y: 0.78 },
];
function decorById(id) { for (const d of DECOR) if (d.id === id) return d; return null; }
/* Themed tanks. Each is finished by filling three stars with beauty; the
 * thresholds grow per tank so the ladder never ends. */
const TANKS = [
  { name: 'CORAL COVE',   tint: null },
  { name: 'SUNKEN RUINS', tint: 'rgba(120,90,200,0.16)' },
  { name: 'KELP FOREST',  tint: 'rgba(40,190,120,0.15)' },
  { name: 'DEEP TRENCH',  tint: 'rgba(20,40,120,0.26)' },
  { name: 'CORAL THRONE', tint: 'rgba(230,120,60,0.16)' },
];
const TANKCFG = { star1: 60, star2: 170, star3: 340, mult: 1.8, priceMult: 1 };
function tankTheme() { return TANKS[Math.min(AQ.tank || 0, TANKS.length - 1)]; }
function tankName() {
  const n = AQ.tank || 0;
  return n < TANKS.length ? TANKS[n].name : 'ABYSS ' + (n - TANKS.length + 2);
}
// star thresholds for the current tank
function tankGoals() {
  const k = Math.pow(TANKCFG.mult, AQ.tank || 0);
  return [TANKCFG.star1, TANKCFG.star2, TANKCFG.star3].map(v => Math.round(v * k));
}
function decorPrice(d) { return Math.max(1, Math.round(d.cost * TANKCFG.priceMult)); }
function ownsDecor(id) { return (AQ.decor || []).indexOf(id) >= 0; }
// what the tank is worth right now: ornaments carry most of it, fish add flair
function tankBeauty() {
  let b = 0;
  for (const id of (AQ.decor || [])) { const d = decorById(id); if (d) b += d.beauty; }
  for (const f of AQ.fish) b += PFFish.beauty(f);
  return b;
}
function tankStars() {
  const b = tankBeauty(), g = tankGoals();
  let n = 0;
  for (const t of g) if (b >= t) n++;
  return n;
}
/* Buying an ornament is the whole point of coins now. */
function buyDecor(d) {
  if (ownsDecor(d.id)) return false;
  const price = decorPrice(d);
  if (!spendCoins(price)) { noCoins(); return false; }
  coinSpendFx(price);
  AQ.decor.push(d.id); saveAq();
  PFA.track('decor_bought', { item: d.id, cost: price, tank: AQ.tank || 0,
    beauty: tankBeauty(), stars: tankStars() });
  toast(d.name + ' added  ·  +' + d.beauty + ' beauty', 2.4);
  Aud.buy(); hapt(18);
  syncTankStars();
  return true;
}
/* Stars are derived from beauty, and beauty moves for more reasons than a
 * purchase (a fish grows up, a new species arrives, live-ops retunes the
 * goals). So the milestone is driven off stored state and re-checked whenever
 * the tank is on screen, not just at the moment of buying. */
function syncTankStars() {
  const st = tankStars(), seen = AQ.starsSeen || 0;
  if (st === seen) return;
  AQ.starsSeen = st; saveAq();
  if (st < seen) return;                      // goals moved up: no celebration
  G.starPop = 1.2;
  Aud.win(); hapt(35);
  PFA.track('tank_star', { tank: AQ.tank || 0, star: st, beauty: tankBeauty() });
  if (st >= 3) tankComplete();
  else toast('STAR ' + st + ' of 3 earned!', 2.6);
}
/* Three stars finishes the tank: a real payout, a permanent trophy, and a
 * fresh themed tank to start beautifying. Fish and the album carry over. */
function tankComplete() {
  if (G.tankDone) return;
  const n = AQ.tank || 0;
  const reward = 150 + n * 100;
  G.tankDone = { t: 0, tank: n, reward, name: tankName() };
  AQ.tanksDone = (AQ.tanksDone || 0) + 1;
  PFA.track('tank_complete', { tank: n, beauty: tankBeauty(), fish: AQ.fish.length, reward });
}
function tankAdvance() {
  const d = G.tankDone;
  G.tankDone = null;
  if (!d) return;
  G.coins += d.reward; store.set('coins', G.coins);
  AQ.food += 5;
  AQ.tank = (AQ.tank || 0) + 1;
  AQ.decor = [];                       // the new tank starts bare
  AQ.starsSeen = tankStars();          // fish alone may already carry a star
  saveAq();
  flyCoins(W / 2, H * 0.45, 10);
  PFA.track('coins_earned', { amount: d.reward, source: 'tank_complete', balance: G.coins });
  toast('Welcome to ' + tankName() + '!  +5 fish food', 3.2);
  Aud.win(); hapt(40);
}
function markSeen(f) {
  if (AQ.seen.indexOf(f.sp) < 0) { AQ.seen.push(f.sp); saveAq(); return true; }
  return false;
}
// every fish already in the tank counts as discovered (also migrates old
// saves). Only write when something actually changed: an unconditional save
// here would persist the empty default if the load ever read back blank.
let aqMigrated = false;
for (const f of AQ.fish) {
  if (AQ.seen.indexOf(f.sp) < 0) { AQ.seen.push(f.sp); aqMigrated = true; }
  if (!f.lastFed) { f.lastFed = Date.now(); aqMigrated = true; }   // pre-v2.8 fish
  const cm = PFFish.sizeCm(f);
  if (!(AQ.best[f.sp] >= cm)) { AQ.best[f.sp] = cm; aqMigrated = true; }
}
if (aqMigrated) saveAq();
// remember the biggest of each species ever raised, so the album keeps the
// record even after that fish is gone
function recordBest(f) {
  const cm = PFFish.sizeCm(f);
  if (!(AQ.best[f.sp] >= cm)) { AQ.best[f.sp] = cm; saveAq(); }
}
function newFish(source) {
  const f = PFFish.mkFish(Math.random, G.level, null, FISHCFG.weights);
  f.fresh = markSeen(f);                        // NEW-species banner flag
  recordBest(f);
  return f;
}
function fishState(f) { return PFFish.hungerState(f, Date.now(), FISHCFG); }
function hungryCount() {
  let n = 0;
  for (const f of AQ.fish) if (fishState(f) !== 'fed') n++;
  return n;
}
/* Reap fish that went unfed past the loss deadline. Runs on boot, on every
 * aquarium open and after each win, so the player always learns about it. */
function reapStarved() {
  if (!FISHCFG.lossOn || !AQ.fish.length) return 0;
  const lost = [];
  for (let i = AQ.fish.length - 1; i >= 0; i--) {
    if (PFFish.hungerState(AQ.fish[i], Date.now(), FISHCFG) === 'lost') {
      lost.push(AQ.fish[i]);
      recordBest(AQ.fish[i]);              // the album keeps the record
      PFA.track('fish_lost', {
        species: PFFish.speciesName(AQ.fish[i]), level: G.level,
        fed: AQ.fish[i].fed, fish_left: AQ.fish.length - 1,
      });
      delete SWIM[AQ.fish[i].id];
      AQ.fish.splice(i, 1);
    }
  }
  if (lost.length) {
    saveAq();
    toast(lost.length === 1
      ? lost[0].name + ' got too hungry and swam away…'
      : lost.length + ' hungry fish swam away…', 3.4);
    Aud.deny(); hapt(30);
  }
  return lost.length;
}
const SWIM = {};   // per-fish runtime swim state
const FLAKES = [];
function swimInit() {
  for (const f of AQ.fish) {
    if (!SWIM[f.id]) {
      SWIM[f.id] = {
        x: W * (0.15 + Math.random() * 0.7),
        y: H * (0.22 + Math.random() * 0.5),
        dir: Math.random() < 0.5 ? -1 : 1,
        speed: 14 + Math.random() * 22,
        wob: Math.random() * 7,
        turnT: 2 + Math.random() * 4,
      };
    }
  }
}

/* ---------- shop + rewarded ads (full cycle, pluggable network) ---------- */
const ADS = { perDay: 5, reward: 30 };
const SHOP_FOOD = { qty: 5, cost: 40 };
const SHOP_EGG = { cost: 150 };
const AD_TIPS = [
  'Fusion works even into FULL flasks!',
  'HARD levels pay double coins — every 8th level.',
  'Perfect clears build your streak bonus.',
  'Feed one favorite fish to grow it fastest.',
  'Order flasks are one-way — pour with intent!',
];
function adsLeftToday() {
  const today = new Date().toDateString();
  if (store.get('adDay', '') !== today) return ADS.perDay;
  return Math.max(0, ADS.perDay - store.get('adCount', 0));
}
function consumeAd() {
  const today = new Date().toDateString();
  if (store.get('adDay', '') !== today) { store.set('adDay', today); store.set('adCount', 0); }
  store.set('adCount', store.get('adCount', 0) + 1);
}
function grantAdReward() {
  consumeAd();
  G.coins += ADS.reward; store.set('coins', G.coins);
  G.pillPulse = 1;
  flyCoins(W / 2, H * 0.5, 8);
  Aud.win(); hapt(30);
  PFA.track('ad_rewarded', { amount: ADS.reward, left: adsLeftToday(), balance: G.coins });
  toast('+' + ADS.reward + ' coins — thanks for watching!', 2.2);
}
function startAd(placement, onReward) {
  // one rewarded-ad pipeline, many placements: shop coins (default), win x2, ...
  placement = placement || 'shop_coins';
  onReward = onReward || grantAdReward;
  if (!adsLeftToday()) { toast('No more ads today — come back tomorrow!', 2.2); Aud.deny(); return; }
  PFA.track('ad_started', { placement });
  function houseAd() {
    G.ad = { t: 0, dur: 5, tip: AD_TIPS[Math.floor(Math.random() * AD_TIPS.length)], onReward, placement };
  }
  if (window.Android && window.Android.showRewardedAd) {
    // native ad network hook (AdMob etc.): Android calls window.__onRewardedAd(ok),
    // or window.__onRewardedAdUnavailable() when it has no fill — then the
    // built-in house ad serves the request instead (same full-watch semantics)
    window.__onRewardedAd = function (ok) {
      if (ok) onReward();
      else { toast('Ad not completed', 2.0); PFA.track('ad_abandoned', { placement }); }
    };
    window.__onRewardedAdUnavailable = function () {
      PFA.track('ad_no_fill', { placement });
      houseAd();
    };
    window.Android.showRewardedAd();
  } else {
    // built-in house ad: same contract — full watch => reward
    houseAd();
  }
}
function drawAd(dt) {

          const f = newFish('egg');

function openExternal(url) {
  try {
    if (window.Android && Android.openUrl) { Android.openUrl(url); return; }
  } catch (e) {}
  try { window.open(url, '_blank'); } catch (e) { location.href = url; }
}

function menuStartPlay() {
  G.phase = 'play';

}
function menuTap(x, y) {
  for (const b of (G._menuBtns || [])) {
    if (!hitRect(b, x, y)) continue;
    PRESS[b.id] = 1;
    if (b.id === 'play') menuStartPlay();
    else if (b.id === 'aquarium') {
      G.aquarium = true; toasts.length = 0; reapStarved(); swimInit(); AquaGL.show(); Aud.click(); hapt(8);
      PFA.track('aquarium_open', { fish: AQ.fish.length, food: AQ.food, hungry: hungryCount(), source: 'menu' });
    } else if (b.id === 'coins' || b.id === 'shopTile') {
      G.shop = true; Aud.click();
      PFA.track('shop_open', { source: 'menu' });
    } else if (b.id === 'settings') openSettings('menu');
    return;
  }
}

function hitRect(b, x, y) {
  if (b.r) return (x - b.x) ** 2 + (y - b.y) ** 2 <= (b.r + 8) ** 2;
  return x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4;
}

/* ---------- aquarium screen ---------- */
function updateAquarium(dt) {
  swimInit();
  for (let i = FLAKES.length - 1; i >= 0; i--) {
    const fl = FLAKES[i];
    fl.t += dt;
    if (fl.y < H - 56) { fl.y += 26 * dt; fl.x += Math.sin(fl.t * 4) * 0.5; }
    if (fl.t > 14) FLAKES.splice(i, 1);
  }
  for (const f of AQ.fish) {
    const s = SWIM[f.id];
    let target = null, best = 1e9;
    for (const fl of FLAKES) {
      const d = Math.abs(fl.x - s.x) + Math.abs(fl.y - s.y);
      if (d < best) { best = d; target = fl; }
    }
    if (target) {
      s.dir = target.x > s.x ? 1 : -1;
      s.x += s.dir * 70 * dt;
      s.y += (target.y - s.y) * Math.min(1, dt * 2.2);
      if (Math.abs(target.x - s.x) < 12 && Math.abs(target.y - s.y) < 12) {
        FLAKES.splice(FLAKES.indexOf(target), 1);
        f.fed += 1; f.lastFed = Date.now(); recordBest(f); saveAq();
        floatText(s.x, s.y - 24, 'nom!', '#ffe9a8', 13);
        Aud.glug(1);
      }
    } else {
      s.turnT -= dt;
      if (s.turnT <= 0) { s.turnT = 2 + Math.random() * 5; if (Math.random() < 0.4) s.dir *= -1; }
      s.x += s.dir * s.speed * dt;
      s.y += Math.sin(G.t * 0.8 + s.wob) * 8 * dt;
      if (s.x < 40) s.dir = 1;
      if (s.x > W - 40) s.dir = -1;
      s.y = Math.max(120, Math.min(H - 90, s.y));
    }
  }
}

function drawAquariumScene(dt) {
  // water (canvas fallback when WebGL is unavailable)
  const g = CX.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3f9fe0'); g.addColorStop(0.6, '#1c64ad'); g.addColorStop(1, '#0b3f7a');
  CX.fillStyle = g; CX.fillRect(0, 0, W, H);
  // light rays
  CX.save();
  CX.globalAlpha = 0.08;
  CX.fillStyle = '#ffffff';
  for (let r = 0; r < 3; r++) {
    const rx = W * (0.2 + r * 0.3) + Math.sin(G.t * 0.3 + r) * 20;
    CX.beginPath();
    CX.moveTo(rx - 20, 0); CX.lineTo(rx + 20, 0);
    CX.lineTo(rx + 90, H); CX.lineTo(rx - 50, H);
    CX.closePath(); CX.fill();
  }
  CX.restore();
  // sand + plants
  CX.fillStyle = '#e8cf9a';
  CX.beginPath();
  CX.moveTo(0, H - 44);
  for (let x = 0; x <= W + 20; x += 20) CX.lineTo(x, H - 44 + Math.sin(x * 0.05) * 5);
  CX.lineTo(W, H); CX.lineTo(0, H);
  CX.closePath(); CX.fill();
  CX.fillStyle = 'rgba(160,120,60,0.35)';
  for (let x = 20; x < W; x += 47) { CX.beginPath(); CX.arc(x, H - 22 + (x % 13), 3.5, 0, 7); CX.fill(); }
  for (let s = 0; s < 3; s++) {
    const sx = W * (0.14 + s * 0.36), sw = Math.sin(G.t * 1.2 + s * 2) * 14;
    CX.strokeStyle = s % 2 ? '#2fae6e' : '#1f8f58';
    CX.lineWidth = 7; CX.lineCap = 'round';
    CX.beginPath();
    CX.moveTo(sx, H - 40);
    CX.quadraticCurveTo(sx + sw * 0.4, H - 90, sx + sw, H - 140 - s * 16);
    CX.stroke();
  }
  // bubbles
  for (const b of bgDecor) {
    if (b.star) continue;
    CX.fillStyle = 'rgba(255,255,255,0.25)';
    CX.beginPath(); CX.arc(b.x * W, b.y * H, b.r + 1, 0, 7); CX.fill();
  }
  // flakes
  for (const fl of FLAKES) {
    CX.fillStyle = '#ffe9a8';
    CX.save();
    CX.translate(fl.x, fl.y); CX.rotate(fl.t * 2);
    CX.fillRect(-3, -2, 6, 4);
    CX.restore();
  }
  // fish
  for (const f of AQ.fish) {
    const s = SWIM[f.id];
    if (s) PFFish.draw(CX, f, s.x, s.y, G.t, s.dir, 1);
  }
}

function drawAquariumUI(dt) {
  if (!AQ.fish.length) {
    CX.fillStyle = 'rgba(255,255,255,0.8)';
    CX.font = fnt(600, 15); CX.textAlign = 'center';
    CX.fillText('Complete level 1 to earn your first fish!', W / 2, H * 0.45);
  }
  const btns = [{ id: 'back', x: 36, y: 38, r: 22 }];
  CX.fillStyle = 'rgba(10,40,80,0.6)';
  CX.beginPath(); CX.arc(36, 38, 22, 0, 7); CX.fill();
  CX.strokeStyle = '#ffffff'; CX.lineWidth = 3; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(43, 29); CX.lineTo(28, 38); CX.lineTo(43, 47);
  CX.stroke();
  outlinedText(tankName(), W / 2, 42, 21, '#ffffff', '#d8ecff', 'rgba(8,40,90,0.9)');
  // three stars + the beauty bar toward the next one: the whole chase, one line
  const stars = tankStars(), goals = tankGoals(), beau = tankBeauty();
  const nextGoal = stars < 3 ? goals[stars] : goals[2];
  const prevGoal = stars === 0 ? 0 : goals[stars - 1];
  const frac2 = stars >= 3 ? 1 : Math.max(0, Math.min(1, (beau - prevGoal) / Math.max(1, nextGoal - prevGoal)));
  const pop = 1 + (G.starPop || 0) * 0.35;
  for (let i = 0; i < 3; i++) {
    const sx = W / 2 - 26 + i * 26, sy = 66;
    CX.save();
    if (i === stars - 1 && G.starPop) { CX.translate(sx, sy); CX.scale(pop, pop); CX.translate(-sx, -sy); }
    if (i < stars) drawStar(sx, sy, 11, GOLD);
    else {
      CX.strokeStyle = 'rgba(255,255,255,0.45)'; CX.lineWidth = 2;
      CX.beginPath(); CX.arc(sx, sy, 8, 0, 7); CX.stroke();
    }
    CX.restore();
  }
  const bbw = Math.min(W - 120, 210), bbx = W / 2 - bbw / 2;
  CX.fillStyle = 'rgba(0,0,0,0.28)';
  rr(bbx, 82, bbw, 12, 6); CX.fill();
  CX.fillStyle = stars >= 3 ? GOLD : '#5ee7d4';
  rr(bbx, 82, Math.max(12, bbw * frac2), 12, 6); CX.fill();
  CX.fillStyle = '#ffffff'; CX.font = fnt(800, 9.5); CX.textAlign = 'center';
  CX.fillText(stars >= 3 ? 'TANK COMPLETE' : beau + ' / ' + nextGoal + ' BEAUTY', W / 2, 91.5);
  CX.fillStyle = 'rgba(255,255,255,0.7)';
  CX.font = fnt(600, 11);
  const nextFishLv = G.level % 5 === 0 ? G.level : G.level - (G.level % 5) + 5;
  CX.fillText('FISH ' + AQ.fish.length + '/16' +
    (AQ.fish.length < 16 ? '  ·  next at level ' + nextFishLv : ''), W / 2, 108);
  // hunger warning: how long until the hungriest fish leaves
  const hungryN = hungryCount();
  if (hungryN && FISHCFG.lossOn) {
    let soonest = Infinity;
    for (const f of AQ.fish) soonest = Math.min(soonest, PFFish.hoursLeft(f, Date.now(), FISHCFG));
    const hrs = Math.max(1, Math.round(soonest));
    const urgent = soonest <= (FISHCFG.loseH - FISHCFG.starveH);
    outlinedText('! ' + hungryN + (hungryN === 1 ? ' FISH IS HUNGRY' : ' FISH ARE HUNGRY') +
      ' - FEED WITHIN ' + hrs + 'H', W / 2, 126, 12.5,
      urgent ? '#ff8091' : '#ffe36a', urgent ? '#e8355f' : '#ffb42e', 'rgba(20,10,40,0.92)');
  }
  // food pill
  const fp = { x: W - 116, y: 14, w: 100, h: 44 };
  chunkyCapsule(fp.x, fp.y, fp.w, fp.h, 22, '#ffffff', '#e8f6ff', '#9fc4e8');
  CX.fillStyle = '#5ee7d4';
  CX.beginPath(); CX.arc(fp.x + 22, fp.y + 22, 10, 0, 7); CX.fill();
  CX.fillStyle = '#0e6e60';
  for (const [fx, fy] of [[-3, -2], [3, -3], [0, 3]]) { CX.beginPath(); CX.arc(fp.x + 22 + fx, fp.y + 22 + fy, 1.7, 0, 7); CX.fill(); }
  outlinedText(String(AQ.food), fp.x + 40, fp.y + 29, 17, '#0e7a95', '#0a5f76', 'rgba(0,0,0,0)', 'left');
  btns.push({ id: 'foodpill', x: fp.x, y: fp.y, w: fp.w, h: fp.h });
  drawTankDecor();
  if (!G.tankDone) syncTankStars();     // beauty can move without a purchase
  // hunger bubbles above each hungry fish (works for both GL and canvas tanks)
  for (const f of AQ.fish) {
    const st = fishState(f), sw = SWIM[f.id];
    if (st === 'fed' || !sw) continue;
    const bx0 = sw.x, by0 = sw.y - PFFish.sizePx(f) * 0.55 - 20;
    const pulse = 0.5 + 0.5 * Math.sin(G.t * (st === 'starving' ? 7 : 3.5));
    CX.save();
    CX.strokeStyle = 'rgba(255,255,255,' + (0.35 + pulse * 0.55).toFixed(2) + ')';
    CX.lineWidth = 3;
    CX.beginPath(); CX.arc(bx0, by0, 11.5, 0, 7); CX.stroke();
    CX.fillStyle = st === 'starving' ? '#e8355f' : '#ffb42e';
    CX.beginPath(); CX.arc(bx0, by0, 9.5, 0, 7); CX.fill();
    CX.strokeStyle = 'rgba(30,10,50,0.55)'; CX.lineWidth = 1.5;
    CX.beginPath(); CX.arc(bx0, by0, 9.5, 0, 7); CX.stroke();
    CX.fillStyle = '#ffffff';
    CX.font = fnt(800, 14); CX.textAlign = 'center';
    CX.fillText('!', bx0, by0 + 5);
    CX.restore();
  }
  // bottom bar: DECOR | FEED | ALBUM as one row with equal gutters. FEED used
  // to be centred with a -24 nudge, which overlapped DECOR by 5px at every
  // width; deriving all three from the same row keeps them from colliding.
  const barPad = 14, barGap = 12, sideW = 62, barH = 54, barY = H - 76;
  const dbX = barPad, abX = W - barPad - sideW;
  const bx = dbX + sideW + barGap, bw = Math.max(90, abX - barGap - bx);
  // album button (bottom-right, opposite the DECOR shelf)
  const abW = sideW, abY = barY;
  chunkyCapsule(abX, abY, abW, barH, 16, '#c07bff', '#8f46e6', '#5c2aa0');
  CX.save();
  CX.translate(abX + abW / 2, abY + 20);
  CX.fillStyle = '#ffffff';
  rr(-11, -9, 22, 18, 3); CX.fill();
  CX.fillStyle = '#8f46e6';
  rr(-8.5, -6.5, 7.5, 13, 2); CX.fill();
  rr(1, -6.5, 7.5, 13, 2); CX.fill();
  CX.restore();
  CX.fillStyle = '#ffffff'; CX.font = fnt(800, 10); CX.textAlign = 'center';
  CX.fillText('ALBUM', abX + abW / 2, abY + 45);
  const seenN = AQ.seen.length;
  if (seenN < PFFish.SPECIES.length) {
    const bt = seenN + '/' + PFFish.SPECIES.length;
    CX.font = fnt(800, 9.5);
    const bw3 = CX.measureText(bt).width + 13, bh3 = 17;
    const bx3 = abX + abW - bw3 + 5, by3 = abY - bh3 / 2;

/* ---------- fish album: the collection, sorted by type ----------
 * A scrollable two-column shelf of big portrait cards. Drag to scroll
 * (with a little inertia); a tap that did not drag opens the card. */
function albumEntries() {
  return PFFish.SPECIES.map((sp, i) => {
    let owned = 0, best = null;
    for (const f of AQ.fish) if (f.sp === i) { owned++; if (!best || f.fed > best.fed) best = f; }
    return { i, sp, owned, best, record: AQ.best[i] || 0, seen: AQ.seen.indexOf(i) >= 0 };
  }).sort((a, b) => a.sp.rarity - b.sp.rarity || a.sp.name.localeCompare(b.sp.name));
}
const ALB = { scroll: 0, max: 0, vel: 0, drag: null, cards: [] };
const DEC = { scroll: 0, max: 0, vel: 0, drag: null, cards: [] };
const TEXT_H = 84;                  // name + detail lines + growth bar
function albumLayout() {
  const cols = W < 300 ? 1 : 2;   // 320px phones still get two columns
  const pad = 14, gap = 12;
  const cw = (Math.min(W, 460) - pad * 2 - gap * (cols - 1)) / cols;
  // height follows the text block (name + 2 detail lines + growth bar), so
  // nothing overflows on narrow cards
  const ch = Math.round(cw * 0.66) + TEXT_H;
  return { cols, pad, gap, cw, ch, x0: (W - Math.min(W, 460)) / 2 + pad, top: 104 };
}
function drawAlbumCard(e, x, y, w, h) {
  const rar = PFFish.RARITY[e.sp.rarity];
  const portH = h - TEXT_H;
  CX.save();
  // card body
  CX.fillStyle = e.seen ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.035)';
  rr(x, y, w, h, 18); CX.fill();
  // portrait window: a slice of tank water
  CX.save();
  rr(x + 6, y + 6, w - 12, portH, 14); CX.clip();
  const wg = CX.createLinearGradient(0, y, 0, y + portH);
  if (e.seen) { wg.addColorStop(0, '#3f9fe0'); wg.addColorStop(1, '#12508f'); }
  else { wg.addColorStop(0, '#16263f'); wg.addColorStop(1, '#0d1a2c'); }
  CX.fillStyle = wg;
  CX.fillRect(x + 6, y + 6, w - 12, portH);
  // god ray + bubbles for a bit of life
  CX.globalAlpha = e.seen ? 0.14 : 0.06;
  CX.fillStyle = '#ffffff';
  CX.beginPath();
  CX.moveTo(x + w * 0.30, y + 6); CX.lineTo(x + w * 0.46, y + 6);
  CX.lineTo(x + w * 0.62, y + 6 + portH); CX.lineTo(x + w * 0.34, y + 6 + portH);
  CX.closePath(); CX.fill();
  CX.globalAlpha = e.seen ? 0.35 : 0.12;
  for (let b = 0; b < 3; b++) {
    const bx = x + 18 + ((b * 37 + e.i * 13) % (w - 36));
    const by = y + 6 + portH - ((G.t * 14 + b * 40 + e.i * 20) % portH);
    CX.beginPath(); CX.arc(bx, by, 1.8 + b * 0.6, 0, 7); CX.fill();
  }
  CX.globalAlpha = 1;
  // the fish itself, big
  const fx = x + w / 2 + w * 0.07, fy = y + 6 + portH * 0.52 + Math.sin(G.t * 1.5 + e.i) * 3;
  const model = e.seen && e.best ? e.best
    : { sp: e.i, c1: e.seen ? '#8fa8c8' : '#1e3350', c2: e.seen ? '#7891b4' : '#182942',
        pat: 0, fed: e.sp.k * 0.9, ph: e.i, lastFed: 0 };
  // the renderer draws the tail beyond the body length, so budget for it
  const sc = Math.min(1.9, (w - 70) / PFFish.sizePx({ sp: e.i, fed: model.fed }));
  CX.save();
  if (e.seen && !e.best) CX.globalAlpha = 0.5;      // discovered, none in tank
  PFFish.draw(CX, model, fx, fy, G.t, 1, sc);
  CX.restore();
  if (!e.seen) {
    CX.fillStyle = 'rgba(255,255,255,0.5)';
    CX.font = fnt(800, 40); CX.textAlign = 'center';
    CX.fillText('?', fx, fy + 14);
  }
  CX.restore();
  // rarity ribbon across the portrait's bottom edge
  CX.fillStyle = e.seen ? rar.col : 'rgba(255,255,255,0.20)';
  rr(x + 6, y + portH - 12, w - 12, 20, 8); CX.fill();
  CX.fillStyle = e.seen ? '#10233d' : 'rgba(255,255,255,0.55)';
  CX.font = fnt(800, 10); CX.textAlign = 'center';
  CX.fillText(rar.name, x + w / 2, y + portH + 2);
  // name
  CX.textAlign = 'center';
  CX.fillStyle = e.seen ? '#ffffff' : 'rgba(255,255,255,0.42)';
  CX.font = fnt(800, 16);
  CX.fillText(e.seen ? e.sp.name : '? ? ?', x + w / 2, y + portH + 30);
  // detail lines
  const ly = y + portH + 48;
  CX.font = fnt(700, 11);
  if (!e.seen) {
    CX.fillStyle = 'rgba(255,255,255,0.42)';
    CX.fillText('UNDISCOVERED', x + w / 2, ly);
    CX.font = fnt(600, 10.5);
    CX.fillStyle = 'rgba(255,255,255,0.3)';
    CX.fillText('Play on to find one', x + w / 2, ly + 15);
  } else {
    // in-tank count + personal record
    CX.fillStyle = e.owned ? '#5ee7d4' : 'rgba(255,255,255,0.4)';
    CX.fillText(e.owned ? 'IN TANK  x' + e.owned : 'NONE IN TANK', x + w / 2, ly);
    CX.fillStyle = 'rgba(255,255,255,0.62)';
    CX.font = fnt(600, 10.5);
    const rec = e.record || (e.best ? PFFish.sizeCm(e.best) : 0);
    CX.fillText('BEST ' + rec.toFixed(1) + ' cm  ·  UP TO ' + e.sp.maxCm + ' cm', x + w / 2, ly + 15);
    // growth bar of the best specimen
    if (e.best) {
      const gw = w - 40, gx = x + 20, gy = ly + 24;
      const fr = PFFish.frac(e.best);
      CX.fillStyle = 'rgba(255,255,255,0.14)';
      rr(gx, gy, gw, 6, 3); CX.fill();
      CX.fillStyle = PFFish.isAdult(e.best) ? '#3ddc84' : '#ffc93c';
      rr(gx, gy, Math.max(6, gw * fr), 6, 3); CX.fill();
    }
  }
  // fully-grown rosette
  if (e.seen && e.best && PFFish.isAdult(e.best)) {
    CX.save();
    CX.shadowColor = GOLD; CX.shadowBlur = 10;
    drawStar(x + w - 20, y + 20, 10, GOLD);
    CX.restore();
  }
  // border last so it sits above the portrait
  CX.strokeStyle = e.seen ? rar.col : 'rgba(255,255,255,0.13)';
  CX.lineWidth = e.seen ? 2.4 : 1.4;
  rr(x, y, w, h, 18); CX.stroke();
  CX.restore();
}
function drawAlbum(dt) {
  if (!G.album) return;
  const L = albumLayout();
  const entries = albumEntries();
  const found = entries.filter(e => e.seen).length;
  const rows = Math.ceil(entries.length / L.cols);
  const viewTop = L.top, viewH = H - viewTop - 12;
  ALB.max = Math.max(0, rows * L.ch + (rows - 1) * L.gap - viewH + 10);
  scrStep(ALB, dt);

  CX.save();
  CX.fillStyle = 'rgba(6,22,46,0.95)';
  CX.fillRect(0, 0, W, H);
  // cards, clipped to the scroll viewport
  CX.save();
  CX.beginPath(); CX.rect(0, viewTop, W, viewH); CX.clip();
  ALB.cards = [];
  entries.forEach((e, n) => {
    const cx0 = L.x0 + (n % L.cols) * (L.cw + L.gap);
    const cy0 = viewTop + Math.floor(n / L.cols) * (L.ch + L.gap) - ALB.scroll;
    if (cy0 > H || cy0 + L.ch < viewTop) return;          // offscreen
    drawAlbumCard(e, cx0, cy0, L.cw, L.ch);
    ALB.cards.push({ id: e.i, x: cx0, y: cy0, w: L.cw, h: L.ch });
  });
  CX.restore();
  // header over the shelf
  const hg = CX.createLinearGradient(0, 0, 0, viewTop);
  hg.addColorStop(0, 'rgba(6,22,46,1)'); hg.addColorStop(1, 'rgba(6,22,46,0.92)');
  CX.fillStyle = hg;
  CX.fillRect(0, 0, W, viewTop);
  outlinedText('FISH ALBUM', W / 2, 46, 24, '#ffffff', '#d8ecff', 'rgba(8,40,90,0.9)');
  CX.fillStyle = 'rgba(255,255,255,0.82)';
  CX.font = fnt(700, 13); CX.textAlign = 'center';
  CX.fillText(found + ' of ' + entries.length + ' species discovered', W / 2, 68);
  const bw = Math.min(W - 80, 240), bx = W / 2 - bw / 2;
  CX.fillStyle = 'rgba(255,255,255,0.16)';
  rr(bx, 78, bw, 8, 4); CX.fill();
  CX.fillStyle = found === entries.length ? GOLD : '#5ee7d4';
  rr(bx, 78, Math.max(8, bw * found / entries.length), 8, 4); CX.fill();
  // close X
  const colW = Math.min(W, 460);
  const cbx = (W - colW) / 2 + colW - 28;
  CX.strokeStyle = 'rgba(255,255,255,0.85)'; CX.lineWidth = 3; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(cbx - 6, 40); CX.lineTo(cbx + 6, 52);
  CX.moveTo(cbx + 6, 40); CX.lineTo(cbx - 6, 52);
  CX.stroke();
  // bottom fade: the cut-off row reads as more content, not a glitch
  if (ALB.scroll < ALB.max - 2) {
    const fg = CX.createLinearGradient(0, H - 54, 0, H);
    fg.addColorStop(0, 'rgba(6,22,46,0)'); fg.addColorStop(1, 'rgba(6,22,46,0.96)');
    CX.fillStyle = fg;
    CX.fillRect(0, H - 54, W, 54);
  }
  // scroll indicator
  if (ALB.max > 4) {
    const tr = viewH - 8, th = Math.max(30, tr * viewH / (viewH + ALB.max));
    const ty = viewTop + 4 + (tr - th) * (ALB.scroll / ALB.max);
    CX.fillStyle = 'rgba(255,255,255,0.10)';
    rr(W - 8, viewTop + 4, 4, tr, 2); CX.fill();
    CX.fillStyle = 'rgba(255,255,255,0.42)';
    rr(W - 8, ty, 4, th, 2); CX.fill();
    // "more below" nudge until the player scrolls
    if (ALB.scroll < 6) {
      CX.globalAlpha = 0.35 + 0.25 * Math.sin(G.t * 3);
      CX.fillStyle = '#ffffff';
      CX.font = fnt(700, 11); CX.textAlign = 'center';
      CX.fillText('swipe for more', W / 2, H - 8);
      CX.globalAlpha = 1;
    }
  }
  CX.restore();
  G._albBtns = [{ id: 'close', x: cbx, y: 46, r: 22 }];
}
/* Shared shelf input: pointerdown starts a drag, pointerup taps only if the
   finger stayed put — so scrolling never fires a card or a BUY button. */
function scrDown(S, x, y) {
  S.drag = { y0: y, sy: S.scroll, last: y, lastT: G.t, moved: 0 };
  S.vel = 0;
}
function scrMove(S, x, y) {
  const d = S.drag;
  if (!d) return;
  const dy = y - d.y0;
  d.moved = Math.max(d.moved, Math.abs(dy));
  S.scroll = Math.max(0, Math.min(S.max, d.sy - dy));
  const dt2 = Math.max(0.001, G.t - d.lastT);
  S.vel = -(y - d.last) / dt2;
  d.last = y; d.lastT = G.t;
}
function scrUp(S, x, y, onTap) {
  const d = S.drag;
  S.drag = null;
  if (!d) return;
  if (d.moved > 8) return;                       // that was a scroll
  S.vel = 0;
  onTap(x, y);
}
function scrStep(S, dt) {                        // inertia + clamp, per frame
  if (!S.drag) {
    if (Math.abs(S.vel) > 1) { S.scroll += S.vel * dt; S.vel *= Math.pow(0.002, dt); }
    else S.vel = 0;
  }
  S.scroll = Math.max(0, Math.min(S.max, S.scroll));
}
// the shelf a drag currently belongs to (decor sits above the album)
function activeShelf() {
  if (G.fishDetail || G.tankDone) return null;
  if (G.decorShop) return DEC;
  if (G.album) return ALB;
  return null;
}
function albumTap(x, y) {
  for (const b of (G._albBtns || [])) {
    if (hitRect(b, x, y)) { G.album = false; Aud.click(); return; }
  }
  // tapping a card you own opens that fish's detail page
  for (const c of ALB.cards) {
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
      let best = null;
      for (const f of AQ.fish) if (f.sp === c.id && (!best || f.fed > best.fed)) best = f;
      if (best) { G.fishDetail = best.id; Aud.buy(); hapt(8); }
      else Aud.click();
      return;
    }
  }
  if (y < 96) return;                            // header taps do nothing
  G.album = false; Aud.click();                  // tap off the shelf closes
}

/* ---------- ornaments: parametric, no assets, drawn over either tank ------ */
function drawOrnament(id, x, base, sc) {
  CX.save();
  CX.translate(x, base);
  CX.scale(sc, sc);
  const sway = Math.sin(G.t * 1.1 + x * 0.03) * 0.04;
  if (id === 'weed') {
    CX.strokeStyle = '#2fae6e'; CX.lineWidth = 6; CX.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      CX.beginPath(); CX.moveTo(i * 9, 0);
      CX.quadraticCurveTo(i * 9 + Math.sin(G.t * 1.4 + i) * 8, -26, i * 7 + Math.sin(G.t * 1.4 + i) * 12, -52);
      CX.stroke();
    }
  } else if (id === 'rock') {
    CX.fillStyle = '#5d6f88';
    CX.beginPath(); CX.ellipse(0, -8, 24, 14, 0, 0, 7); CX.fill();
    CX.fillStyle = '#748aa6';
    CX.beginPath(); CX.ellipse(-6, -22, 14, 10, 0.2, 0, 7); CX.fill();
    CX.fillStyle = '#8ea4bf';
    CX.beginPath(); CX.ellipse(6, -34, 9, 7, -0.2, 0, 7); CX.fill();
  } else if (id === 'coral') {
    CX.rotate(sway);
    for (const [dx, col, h] of [[-14, '#ff7ab8', 40], [0, '#ff5f7e', 56], [14, '#ffb36b', 44]]) {
      CX.strokeStyle = col; CX.lineWidth = 7; CX.lineCap = 'round';
      CX.beginPath(); CX.moveTo(dx, 0); CX.lineTo(dx, -h); CX.stroke();
      CX.beginPath(); CX.moveTo(dx, -h * 0.6); CX.lineTo(dx + (dx ? 10 : -10), -h * 0.9); CX.stroke();
    }
  } else if (id === 'shell') {
    CX.fillStyle = '#f0d7ef';
    CX.beginPath(); CX.ellipse(0, -10, 26, 20, 0, Math.PI, 0); CX.fill();
    CX.fillStyle = '#d9a8d6';
    CX.beginPath(); CX.ellipse(0, -8, 26, 8, 0, 0, 7); CX.fill();
    CX.strokeStyle = '#c98fc6'; CX.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      CX.beginPath(); CX.moveTo(0, -9); CX.lineTo(i * 11, -27); CX.stroke();
    }
    CX.fillStyle = '#fff6ea';
    CX.beginPath(); CX.arc(0, -14, 4.5, 0, 7); CX.fill();
  } else if (id === 'ring') {
    CX.strokeStyle = 'rgba(190,240,255,0.85)'; CX.lineWidth = 4;
    CX.beginPath(); CX.arc(0, -20, 22, 0, 7); CX.stroke();
    for (let i = 0; i < 7; i++) {
      const a = G.t * 1.1 + i * 0.9;
      CX.fillStyle = 'rgba(255,255,255,0.75)';
      CX.beginPath(); CX.arc(Math.cos(a) * 22, -20 + Math.sin(a) * 22, 3.2, 0, 7); CX.fill();
    }
  } else if (id === 'amphora') {
    CX.fillStyle = '#c98a4b';
    CX.beginPath();

/* Ornaments are laid out across the tank in purchase order, so every buy is
   visible immediately. */
function drawTankDecor() {
  const owned = AQ.decor || [];
  if (!owned.length) return;
  const slots = [0.20, 0.78, 0.42, 0.88, 0.10, 0.60, 0.30, 0.70, 0.50, 0.94, 0.06, 0.84];
  owned.forEach((id, i) => {

/* ---------- decor shop: the coin sink that grows the tank ---------- */
function drawDecorShop(dt) {
  if (!G.decorShop) return;
  const rowH = 78, gap = 8, pad = 14;
  const colW = Math.min(W, 460), x0 = (W - colW) / 2 + pad, rw = colW - pad * 2;
  const viewTop = 116, viewH = H - viewTop - 12;
  DEC.max = Math.max(0, DECOR.length * (rowH + gap) - gap - viewH + 8);
  scrStep(DEC, dt);
  CX.save();
  CX.fillStyle = 'rgba(6,22,46,0.95)';
  CX.fillRect(0, 0, W, H);
  CX.save();
  CX.beginPath(); CX.rect(0, viewTop, W, viewH); CX.clip();
  DEC.cards = [];
  DECOR.forEach((d, i) => {
    const y = viewTop + i * (rowH + gap) - DEC.scroll;
    if (y > H || y + rowH < viewTop) return;
    const owned = ownsDecor(d.id), price = decorPrice(d), afford = G.coins >= price;
    CX.fillStyle = owned ? 'rgba(93,231,212,0.10)' : 'rgba(255,255,255,0.07)';

    // preview
    CX.save();
    rr(x0 + 6, y + 6, 74, rowH - 12, 12); CX.clip();
    const pg = CX.createLinearGradient(0, y, 0, y + rowH);
    pg.addColorStop(0, '#3f9fe0'); pg.addColorStop(1, '#12508f');
    CX.fillStyle = pg; CX.fillRect(x0 + 6, y + 6, 74, rowH - 12);
    drawOrnament(d.id, x0 + 43, y + rowH - 12, 0.52);
    CX.restore();
    // name + beauty
    CX.textAlign = 'left';
    CX.fillStyle = '#ffffff'; CX.font = fnt(800, 15);
    CX.fillText(d.name, x0 + 92, y + 28);
    CX.fillStyle = '#5ee7d4'; CX.font = fnt(800, 12);
    CX.fillText('+' + d.beauty + ' BEAUTY', x0 + 92, y + 48);
    // buy button / owned tick
    const bw2 = 84, bx2 = x0 + rw - bw2 - 12, by2 = y + rowH / 2 - 19;
    if (owned) {
      CX.fillStyle = 'rgba(93,231,212,0.16)';
      rr(bx2, by2, bw2, 38, 19); CX.fill();
      CX.strokeStyle = '#5ee7d4'; CX.lineWidth = 2; CX.lineCap = 'round';
      CX.beginPath();
      CX.moveTo(bx2 + 30, by2 + 19); CX.lineTo(bx2 + 38, by2 + 26); CX.lineTo(bx2 + 54, by2 + 11);
      CX.stroke();
    } else {
      CX.globalAlpha = afford ? 1 : 0.45;
      chunkyCapsule(bx2, by2, bw2, 38, 19, '#7ce75a', '#34b24a', '#166e2c');
      CX.font = fnt(800, 13);
      drawCoin(bx2 + 18, by2 + 19, 8);
      outlinedText(String(price), bx2 + 30, by2 + 24, 13, '#ffffff', '#e2ffe6', 'rgba(10,70,26,0.92)', 'left');
      CX.globalAlpha = 1;
      DEC.cards.push({ id: d.id, x: bx2 - 6, y: y, w: bw2 + 18, h: rowH });
    }
  });
  CX.restore();
  // header
  const hg = CX.createLinearGradient(0, 0, 0, viewTop);
  hg.addColorStop(0, 'rgba(6,22,46,1)'); hg.addColorStop(1, 'rgba(6,22,46,0.92)');
  CX.fillStyle = hg; CX.fillRect(0, 0, W, viewTop);
  outlinedText('DECORATE', W / 2, 46, 24, '#ffffff', '#ffe9a8', 'rgba(90,50,0,0.9)');
  const stars = tankStars(), goals = tankGoals(), beau = tankBeauty();

  CX.fillStyle = 'rgba(255,255,255,0.8)'; CX.font = fnt(700, 12.5); CX.textAlign = 'center';
  CX.fillText(tankName() + '  ·  ' + beau + ' / ' + nextGoal + ' beauty for star ' + Math.min(3, stars + 1), W / 2, 68);
  const bw3 = Math.min(W - 90, 230), bx3 = W / 2 - bw3 / 2;
  const prevGoal = stars === 0 ? 0 : goals[stars - 1];
  const fr = stars >= 3 ? 1 : Math.max(0, Math.min(1, (beau - prevGoal) / Math.max(1, nextGoal - prevGoal)));
  CX.fillStyle = 'rgba(255,255,255,0.16)';
  rr(bx3, 78, bw3, 9, 4.5); CX.fill();
  CX.fillStyle = stars >= 3 ? GOLD : '#5ee7d4';
  rr(bx3, 78, Math.max(9, bw3 * fr), 9, 4.5); CX.fill();
  // wallet
  const cp2 = { x: W / 2 - 60, y: 94 };

  CX.fillStyle = '#ffe9a8'; CX.font = fnt(800, 15); CX.textAlign = 'left';
  CX.fillText(String(Math.round(G.coins)) + ' coins', cp2.x + 28, cp2.y + 15);
  const cbx2 = (W - colW) / 2 + colW - 28;

  CX.beginPath();

  CX.moveTo(cbx2 + 6, 40); CX.lineTo(cbx2 - 6, 52);
  CX.stroke();
  if (DEC.max > 4) {
    const tr = viewH - 8, th = Math.max(30, tr * viewH / (viewH + DEC.max));

  }
  CX.restore();
  G._decBtns = [{ id: 'close', x: cbx2, y: 46, r: 22 }];
}
function decorTap(x, y) {
  for (const b of (G._decBtns || [])) {
    if (hitRect(b, x, y)) { G.decorShop = false; Aud.click(); return; }
  }
  for (const c of DEC.cards) {
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
      const d = decorById(c.id);
      if (d) buyDecor(d);
      return;
    }
  }
  if (y < 116) return;
  G.decorShop = false; Aud.click();
}

function aquariumTap(x, y) {
  if (G.fishDetail) {
    const D = G._fdBtns;
    if (!D) return;
    for (const b of D.btns) {
      if (hitRect(b, x, y)) {
        if (b.id === 'close') { G.fishDetail = null; Aud.click(); }
        else if (b.id === 'rename') {
          let nn = null;
          try { nn = window.prompt('Name your fish', D.fish.name); } catch (e) { nn = null; }
          if (nn === null || nn === undefined) {
            if (typeof window.prompt !== 'function') { D.fish.name = PFFish.randomName(); saveAq(); }
          } else if (String(nn).trim()) {
            D.fish.name = String(nn).trim().slice(0, 14);
            saveAq();
            PFA.track('fish_renamed', {});
            toast('Named ' + D.fish.name + '!', 1.8);
            Aud.buy();
          }
        }
        return;
      }
    }
    if (!hitRect(D.card, x, y)) { G.fishDetail = null; Aud.click(); }
    return;
  }
  for (const b of (G._aqBtns || [])) {
    if (hitRect(b, x, y)) {
      if (b.id === 'back') { G.aquarium = false; G.fishDetail = null; AquaGL.hide(); Aud.click(); }
      else if (b.id === 'album') {
        G.album = true; ALB.scroll = 0; ALB.vel = 0; ALB.drag = null; Aud.buy(); hapt(8);
        PFA.track('album_open', { seen: AQ.seen.length, species: PFFish.SPECIES.length, fish: AQ.fish.length });
      }
      else if (b.id === 'decor') {
        G.decorShop = true; DEC.scroll = 0; DEC.vel = 0; DEC.drag = null;
        Aud.buy(); hapt(8);
        PFA.track('decor_open', { tank: AQ.tank || 0, owned: (AQ.decor || []).length, beauty: tankBeauty() });
      }
      else if (b.id === 'feed') {
        if (!AQ.fish.length) { toast('Complete level 1 to get your first fish!', 2.2); Aud.deny(); return; }
        if (AQ.food > 0) {
          AQ.food--; saveAq();
          FLAKES.push({ x: W * (0.25 + Math.random() * 0.5), y: 92, t: 0 });
          PFA.track('fish_fed', { left: AQ.food, fish: AQ.fish.length });
          Aud.pop(); hapt(10);
        } else { G.shop = true; G.aquarium = false; AquaGL.hide(); PFA.track('shop_open', { source: 'aquarium_food' }); }
      } else if (b.id === 'foodpill') { G.shop = true; G.aquarium = false; AquaGL.hide(); PFA.track('shop_open', { source: 'aquarium_pill' }); }
      return;
    }
  }
  // tap a fish for details
  for (const f of AQ.fish) {
    const s = SWIM[f.id];
    if (!s) continue;
    const r = PFFish.sizePx(f) * 0.75 + 10;
    if ((x - s.x) ** 2 + (y - s.y) ** 2 <= r * r) { G.fishDetail = f.id; Aud.click(); hapt(8); return; }
  }
}

/* ---------- background: vivid candy world ---------- */
const bgDecor = [];
for (let i = 0; i < 32; i++) bgDecor.push({
  x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.6,
  v: 0.006 + Math.random() * 0.016, tw: Math.random() * 7, star: i % 4 === 0,
});
function drawBG(dt) {
  const g = CX.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5b2be0');
  g.addColorStop(0.52, '#8b3cf0');
  g.addColorStop(1, '#c94fe0');
  CX.fillStyle = g;
  CX.fillRect(0, 0, W, H);
  // soft sky glow
  const rg = CX.createRadialGradient(W / 2, H * 0.28, 0, W / 2, H * 0.28, H * 0.55);
  rg.addColorStop(0, 'rgba(255,255,255,0.14)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  CX.fillStyle = rg; CX.fillRect(0, 0, W, H);
  // rolling wave bands at the bottom
  for (const [amp, yb, al] of [[14, 0.86, 0.10], [20, 0.93, 0.15]]) {
    CX.fillStyle = 'rgba(45,8,105,' + al + ')';
    CX.beginPath();
    CX.moveTo(0, H);
    for (let x = 0; x <= W + 16; x += 16) {
      CX.lineTo(x, H * yb + Math.sin(x * 0.018 + G.t * 0.45 + yb * 40) * amp);
    }
    CX.lineTo(W, H);
    CX.closePath(); CX.fill();
  }
  // twinkling sparkles + rising bubbles
  for (const b of bgDecor) {
    b.y -= b.v * dt * 6;
    b.tw += dt * 3;
    if (b.y < -0.03) { b.y = 1.03; b.x = Math.random(); }
    const a = 0.12 + 0.14 * (1 + Math.sin(b.tw)) * 0.5;
    CX.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    if (b.star) {
      const x = b.x * W, y = b.y * H, r = b.r * 2.4;
      CX.beginPath();
      CX.moveTo(x, y - r); CX.quadraticCurveTo(x, y, x + r, y);
      CX.quadraticCurveTo(x, y, x, y + r);
      CX.quadraticCurveTo(x, y, x - r, y);
      CX.quadraticCurveTo(x, y, x, y - r);
      CX.fill();
    } else {
      CX.beginPath(); CX.arc(b.x * W, b.y * H, b.r, 0, 7); CX.fill();
    }
  }
  // gentle vignette
  const v = CX.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 0.8);
  v.addColorStop(0, 'rgba(30,0,70,0)'); v.addColorStop(1, 'rgba(30,0,70,0.30)');
  CX.fillStyle = v; CX.fillRect(0, 0, W, H);
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  G.t += dt; G.idleT += dt; G.selT += dt;
  if (G.lockT > 0) G.lockT -= dt;
  if (G.denyT > 0) G.denyT -= dt;
  if (G.pillPulse > 0) G.pillPulse = Math.max(0, G.pillPulse - dt * 4);
  if (G.starPop > 0) G.starPop = Math.max(0, G.starPop - dt * 1.6);
  for (let i = 0; i < G.pop.length; i++) G.pop[i] += dt;
  for (let i = 0; i < G.pulse.length; i++) if (G.pulse[i] > 0) G.pulse[i] = Math.max(0, G.pulse[i] - dt * 5);
  for (const k in PRESS) if (PRESS[k] > 0) PRESS[k] = Math.max(0, PRESS[k] - dt * 7);
  // coin counter easing
  G.coinShown += (G.coins - G.coinShown) * Math.min(1, dt * 10);
  if (Math.abs(G.coins - G.coinShown) < 0.5) G.coinShown = G.coins;
  stepAnims(dt);
  if ((G.phase === 'play' || G.phase === 'menu') && !anims.length && !G.gift && G.lockT <= 0 && G.idleT > 0.5) Foundry.tick();
  // idle guidance on every level: after a thinking pause the best-move
  // flask glows softly, then escalates to the full arrow (replaces the old
  // paid HINT button — guidance is free and never costs the star rating)
  const guideDelay = G.level <= 3 ? 4 : 8;
  if (G.phase === 'play' && G.idleT > guideDelay && !G.hint && !G.gift && !anims.length && G.lockT <= 0) {
    let mv = null;
    if (!G.deviated && G.solStep < G.solution.length) mv = G.solution[G.solStep];
    else { const sol = PF.solve(G.state, { maxNodes: 20000, maxDepth: 48 }); if (sol && sol.length) mv = sol[0]; }
    if (mv) { G.hint = { from: mv[0], to: mv[1], soft: G.level > 3 }; G.hintT = 0; }
    else {
      if (!G.stuckHinted) { G.stuckHinted = true; toast('Looks stuck — try UNDO or SHUFFLE', 2.6); }
      G.idleT = 0;
    }
  }
  let ox = 0, oy = 0;
  if (G.shake > 0.2) {
    G.shakeT += dt;
    const damp = Math.max(0, 1 - G.shakeT * 6);
    ox = (Math.random() - 0.5) * G.shake * damp;
    oy = (Math.random() - 0.5) * G.shake * damp;
    if (damp <= 0) G.shake = 0;
  }
  CX.save();
  CX.translate(ox, oy);
  if (G.phase === 'signin') {
    drawBG(dt);
    drawSignin(dt);
  } else if (G.aquarium) {
    updateAquarium(dt);
    if (AquaGL.on()) {
      CX.clearRect(0, 0, W, H);
      AquaGL.render(dt, G.t);
    } else {
      drawAquariumScene(dt);
    }
    drawAquariumUI(dt);
    drawAlbum(dt);
    drawDecorShop(dt);
    drawFishDetail(dt);        // above the shelves, so a card can open it
    drawTankDone(dt);          // the celebration owns the screen
  } else if (G.phase === 'menu') {
    drawBG(dt);
    drawMenu(dt);
    drawGift(dt);      // daily gift greets the session on the home screen
    drawAccount(dt);
  } else {
  drawBG(dt);
  drawOrderShelf();
  for (let i = 0; i < G.view.flasks.length; i++) drawFlask(i);
  drawPouring();
  drawHint(dt);
  // rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt * 2.4; r.r += dt * 260;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    CX.globalAlpha = r.life * 0.8;
    CX.strokeStyle = r.col;
    CX.lineWidth = 3 * r.life;
    CX.beginPath(); CX.arc(r.x, r.y, r.r, 0, 7); CX.stroke();
  }
  CX.globalAlpha = 1;
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= p.decay * dt;
    if (p.life <= 0 || p.y > H + 20) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    CX.globalAlpha = Math.max(0, Math.min(1, p.life));
    CX.fillStyle = p.col;
    if (p.sq) {
      p.rot += p.vr * dt;
      CX.save(); CX.translate(p.x, p.y); CX.rotate(p.rot);
      CX.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.7);
      CX.restore();
    } else {
      CX.beginPath(); CX.arc(p.x, p.y, p.r * Math.max(0.3, p.life), 0, 7); CX.fill();
    }
  }
  CX.globalAlpha = 1;
  drawArmHighlights();
  drawHUD(dt);
  if (G.flash > 0) {
    CX.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.13).toFixed(3) + ')';
    CX.fillRect(0, 0, W, H);
    G.flash = Math.max(0, G.flash - dt * 4);
  }
  drawBanner(dt);
  if (G.phase === 'win') drawWin(dt);
  drawGift(dt);
  drawAccount(dt);
  }
  drawShop(dt);
  drawSettings(dt);
  // flying coins (over win card)
  const cp = coinPillPos();
  for (let i = coinFly.length - 1; i >= 0; i--) {
    const c = coinFly[i];
    c.t += dt;
    if (c.t < 0) continue;
    const k = Math.min(1, c.t / c.dur);
    const e = k * k * (3 - 2 * k);
    const x = c.sx + (cp.x + 19 - c.sx) * e;
    const y = c.sy + (cp.y + 17 - c.sy) * e - Math.sin(k * Math.PI) * 46;
    drawCoin(x, y, 9);
    if (k >= 1) { coinFly.splice(i, 1); Aud.coin(); G.pillPulse = 1; }
  }
  // floating text
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt * 0.9;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    f.y += f.vy * dt;
    CX.save();
    CX.globalAlpha = Math.min(1, f.life * 2);
    if (f.big) {
      const age = Math.min(1, (1.15 - f.life) * 3.4);
      const sc = easeOutBack(age);
      CX.translate(f.x, f.y); CX.scale(sc, sc); CX.translate(-f.x, -f.y);
      outlinedText(f.text, f.x, f.y, f.size, '#ffffff', f.col);
    } else {
      CX.font = fnt(800, f.size);
      CX.textAlign = 'center';
      CX.lineWidth = 4; CX.strokeStyle = 'rgba(10,12,26,0.8)';
      CX.strokeText(f.text, f.x, f.y);
      CX.fillStyle = f.col;
      CX.fillText(f.text, f.x, f.y);
    }
    CX.restore();
  }
  // Toasts sit in the lane between the board and whichever bottom bar is on
  // screen. A fixed H-132 put them on top of the last flask row on short
  // phones, so anchor them to the bar that is actually there.
  const _undo = BTNS.find(b => b.id === 'undo');
  const _barTop = G.aquarium ? H - 76 : Math.min(_undo ? _undo.y : H - 104, H - 83);
  for (let i = toasts.length - 1; i >= 0; i--) {
    const t = toasts[i];
    t.life -= dt;
    if (t.life <= 0) { toasts.splice(i, 1); continue; }
    const a = Math.min(1, t.life / 0.4) * Math.min(1, (t.max - t.life) / 0.25 + 0.2);
    CX.globalAlpha = a;
    CX.font = fnt(800, 15);
    const tw = CX.measureText(t.msg).width + 34;
    const ty = _barTop - 22 - i * 44;
    CX.fillStyle = 'rgba(255,255,255,0.97)';
    rr(W / 2 - tw / 2, ty - 16, tw, 34, 17);
    CX.fill();
    CX.strokeStyle = 'rgba(150,90,230,0.35)';
    CX.stroke();
    CX.fillStyle = '#6a2fd8';
    CX.textAlign = 'center';
    CX.fillText(t.msg, W / 2, ty + 6);
    CX.globalAlpha = 1;
  }
  drawAd(dt);
  drawConsent(dt);
  CX.restore();
}

/* ---------- boot ---------- */
function initDailyGift() {
  try {
    const today = new Date().toDateString();
    const last = store.get('giftDay', null);
    if (last === today) return;
    const yest = new Date(Date.now() - 864e5).toDateString();
    const streak = last === yest ? (store.get('giftStreak', 1) + 1) : 1;
    G.gift = { amount: Math.min(ECON.giftBase + ECON.giftPer * (streak - 1), ECON.giftCap), streak };
    G.giftT = 0;
  } catch (e) {}
}

PFAuth.onChange = function (kind) {
  if (kind === 'signin') {
    const u = PFAuth.user();
    PFA.setUser(u && u.id);
    PFA.track('sign_in', { provider: u && u.provider });
    toast('Signed in as ' + ((u && u.name) || 'player'), 2.6);
    if (G.phase === 'signin') enterAfterGate();
    G.account = false;
    Aud.win(); hapt(30);
  } else if (kind === 'signout') {
    PFA.track('sign_out', {});
    PFA.setUser(null);
    toast('Signed out', 1.8);
  } else if (kind && kind.indexOf('error:') === 0) {
    toast('Sign-in didn\u2019t finish \u2014 try again', 2.4);
    Aud.deny();
  }
};

CV.style.position = 'relative';
CV.style.zIndex = '2';
AquaGL.init({
  fish: () => AQ.fish,
  swim: () => SWIM,
  flakes: () => FLAKES,
  sizePx: f => PFFish.sizePx(f),
});
resize();
// live-ops remote config: cached copy applies instantly, network refresh follows
const RC_DEFAULTS = {
  hintCost: ECON.hintCost, shuffleCost: ECON.shuffleCost, vialCost: ECON.vialCost,
  pipetteCost: ECON.pipetteCost, catalystCost: ECON.catalystCost,
  vialMax: ECON.vialMax, giftBase: ECON.giftBase, giftPer: ECON.giftPer,
  giftCap: ECON.giftCap, adsPerDay: ADS.perDay, adReward: ADS.reward,
  foodCost: SHOP_FOOD.cost, foodQty: SHOP_FOOD.qty, eggCost: SHOP_EGG.cost,
  tankStar1: TANKCFG.star1, tankStar2: TANKCFG.star2, tankStar3: TANKCFG.star3,
  tankMult: TANKCFG.mult, decorPrice: TANKCFG.priceMult,
};
function applyRemoteConfig() {
  ECON.hintCost    = PFRC.num('hint_cost',    RC_DEFAULTS.hintCost,    0, 500);
  ECON.shuffleCost = PFRC.num('shuffle_cost', RC_DEFAULTS.shuffleCost, 0, 500);
  ECON.vialCost    = PFRC.num('vial_cost',    RC_DEFAULTS.vialCost,    0, 500);
  ECON.vialMax     = PFRC.num('vial_max',     RC_DEFAULTS.vialMax,     0, 4);
  ECON.pipetteCost = PFRC.num('pipette_cost',  RC_DEFAULTS.pipetteCost,  0, 500);
  ECON.catalystCost= PFRC.num('catalyst_cost', RC_DEFAULTS.catalystCost, 0, 500);
  ECON.giftBase    = PFRC.num('gift_base',    RC_DEFAULTS.giftBase,    0, 500);
  ECON.giftPer     = PFRC.num('gift_per',     RC_DEFAULTS.giftPer,     0, 100);
  ECON.giftCap     = PFRC.num('gift_cap',     RC_DEFAULTS.giftCap,     0, 1000);
  ADS.perDay       = PFRC.num('ads_per_day',  RC_DEFAULTS.adsPerDay,   0, 50);
  ADS.reward       = PFRC.num('ad_reward',    RC_DEFAULTS.adReward,    0, 500);
  SHOP_FOOD.cost   = PFRC.num('food_cost',    RC_DEFAULTS.foodCost,    0, 999);
  SHOP_FOOD.qty    = PFRC.num('food_qty',     RC_DEFAULTS.foodQty,     1, 50);
  SHOP_EGG.cost    = PFRC.num('egg_cost',     RC_DEFAULTS.eggCost,     0, 9999);
  TANKCFG.star1     = PFRC.num('tank_star1',    RC_DEFAULTS.tankStar1, 1, 100000);
  TANKCFG.star2     = Math.max(TANKCFG.star1, PFRC.num('tank_star2', RC_DEFAULTS.tankStar2, 1, 200000));
  TANKCFG.star3     = Math.max(TANKCFG.star2, PFRC.num('tank_star3', RC_DEFAULTS.tankStar3, 1, 400000));
  TANKCFG.mult      = PFRC.num('tank_mult',      RC_DEFAULTS.tankMult,   1, 10);
  TANKCFG.priceMult = PFRC.num('decor_price_mult', RC_DEFAULTS.decorPrice, 0.1, 10);
  // fish drop table: one clamped weight per species (blank = built-in rarity)
  const wmap = {};
  let anyW = false;
  for (const sp of PFFish.SPECIES) {
    const sl = PFFish.slug(sp);
    const v = PFRC.num('fish_w_' + sl, -1, -1, 1000);
    if (v >= 0) { wmap[sl] = v; anyW = true; }
  }
  FISHCFG.weights = anyW ? wmap : null;
  // hunger clock, kept monotonic so a bad config can't invert the stages
  FISHCFG.hungryH  = PFRC.num('fish_hungry_h', 24, 1, 8760);
  FISHCFG.starveH  = Math.max(FISHCFG.hungryH, PFRC.num('fish_starve_h', 48, 1, 8760));
  FISHCFG.loseH    = Math.max(FISHCFG.starveH, PFRC.num('fish_lose_h',   72, 2, 8760));
  FISHCFG.lossOn   = PFRC.flag('fish_loss_enabled', true);
  const note = String(PFRC.get('notice', '') || '');
  if (note && store.get('rcNoticeV', -1) !== PFRC.version()) {
    toast(note.slice(0, 90), 4.5);
    store.set('rcNoticeV', PFRC.version());
  }
}
PFRC.onApply(applyRemoteConfig);
PFRC.init(typeof PF_CONFIG !== 'undefined' ? PF_CONFIG : null);
reapStarved();          // fish that starved while the app was closed
// analytics builds ask once for consent before anything is tracked
if (PFA.enabled && PFA.consent() === null) G.consent = true;
PFAuth.init();
if (PFAuth.signedIn()) PFA.setUser(PFAuth.user().id);
PFA.track('session_start', {
  level: G.level, balance: G.coins, streak: G.streak,
  signed_in: PFAuth.signedIn() ? 1 : 0,
});
loadLevel(G.level, true);
if (PFAuth.shouldShowGate()) { G.phase = 'signin'; toasts.length = 0; }
else if (G.level <= 1) {
  // first install: straight into level 1 — time-to-fun beats a menu
  // (genre FTUE convention); the main menu greets every later session
  G.phase = 'play';
  G.levelStarted = true;
  PFA.track('level_start', { level: G.level, hard: G.hard ? 1 : 0, par: G.par });
  levelIntroToasts(1);
  initDailyGift();
} else { G.phase = 'menu'; initDailyGift(); }
requestAnimationFrame(frame);
</script>
</body>
