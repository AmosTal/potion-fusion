'use strict';
/* ================= Potion Fusion — presentation layer ================= */
if (typeof PF_PACK !== 'undefined') PF.usePack(PF_PACK);

const CV = document.getElementById('c');
const CX = CV.getContext('2d');

const PAL      = { R:'#ff3b5f', Y:'#ffd93d', B:'#3fa9ff', O:'#ff9f2e', G:'#3ddc84', P:'#c976ff', T:'#14d0c4', M:'#ff4fd8', L:'#b7e514' };
const PAL_DARK = { R:'#b81b40', Y:'#cf9c10', B:'#1a6fc4', O:'#cf7409', G:'#17a35a', P:'#963ae8', T:'#0a8f8f', M:'#c122a4', L:'#7fa30a' };
const GLYPH = { R:'tri', Y:'dot', B:'sq', O:'dia', G:'plus', P:'star', T:'ring', M:'heart', L:'leaf' };
const CAP = PF.CAP;
const GOLD = '#ffc93c', GOLD_D = '#e09a12';
const FF = 'Baloo2,system-ui,sans-serif';
const VERSION = (typeof PF_CONFIG !== 'undefined' && PF_CONFIG.appVersion) || '2.6';
const PRIVACY_URL = 'https://amostal.github.io/potion-fusion-console/privacy.html';
function fnt(w, s) { return w + ' ' + s + 'px ' + FF; }

/* Economy calibration: earning stays satisfying (base 10 + perfect 10 +
 * streak), but boosters are real purchases now — a vial costs ~5 average
 * clears, a hint ~2.5 — matching genre booster-to-payout ratios. */
const ECON = {
  startCoins: 30, base: 10, perfect: 10, streakPer: 2, streakCap: 10,
  hintCost: 25, vialCost: 50, shuffleCost: 35, vialMax: 2,   // hintCost: legacy remote-config knob, no UI since v2.7
  pipetteCost: 40, catalystCost: 60,                         // v3.0 powerups
  giftBase: 20, giftPer: 5, giftCap: 40,
};

/* ---------- persistence ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pf_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pf_' + k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- haptics ---------- */
function hapt(ms) {
  if (!hapt.on) return;
  try {
    if (window.Android && Android.vibrate) Android.vibrate(ms);
    else if (navigator.vibrate) navigator.vibrate(ms);
  } catch (e) {}
}
hapt.on = store.get('haptics', true);

/* ---------- audio (synthesized, no assets) ---------- */
const Aud = {
  ctx: null, master: null, on: store.get('sound', true),
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  env(t0, dur, peak) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    g.connect(this.master);
    return g;
  },
  tone(freq, dur, type, peak, t0, slide) {
    if (!this.on || !this.ensure()) return;
    t0 = t0 || this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    o.connect(this.env(t0, dur, peak || 0.25));
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, peak, fc, t0) {
    if (!this.on || !this.ensure()) return;
    t0 = t0 || this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc || 900; f.Q.value = 1.2;
    src.connect(f); f.connect(this.env(t0, dur, peak || 0.2));
    src.start(t0);
  },
  glug(i) { this.tone(220 + Math.random() * 60 + i * 30, 0.09, 'sine', 0.18, null, 130); this.noise(0.05, 0.05, 1400); },
  fuse() {
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime;
    this.tone(392, 0.16, 'triangle', 0.22, t, 523);
    this.tone(494, 0.16, 'triangle', 0.22, t, 659);
    this.tone(784, 0.25, 'sine', 0.12, t + 0.10);
    this.noise(0.18, 0.10, 3200, t + 0.02);
  },
  deliver() { this.tone(660, 0.08, 'sine', 0.16, null, 880); },
  cork() {
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime;
    this.noise(0.05, 0.25, 700, t);
    this.tone(523, 0.12, 'sine', 0.2, t + 0.03, 1046);
  },
  win() {
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime;
    [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.2, t + i * 0.09));
    this.noise(0.5, 0.06, 5000, t + 0.2);
  },
  star(i) { this.tone(700 + i * 180, 0.18, 'triangle', 0.22, null, 900 + i * 220); },
  coin() { this.tone(1250 + Math.random() * 180, 0.06, 'sine', 0.10, null, 1600); },
  buy() {
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime;
    this.tone(520, 0.09, 'sine', 0.18, t, 700);
    this.tone(880, 0.12, 'sine', 0.15, t + 0.07, 1100);
  },
  pop() { this.tone(320, 0.10, 'sine', 0.16, null, 520); this.noise(0.04, 0.06, 2000); },
  praise(tier) {
    if (!this.on || !this.ensure()) return;
    const t = this.ctx.currentTime;
    const base = [659, 784, 988][Math.min(tier, 2)];
    this.tone(base, 0.14, 'triangle', 0.2, t);
    this.tone(base * 1.5, 0.2, 'triangle', 0.18, t + 0.09);
  },
  deny() { this.tone(140, 0.12, 'square', 0.10, null, 90); },
  click() { this.tone(700, 0.04, 'sine', 0.08); },
};

/* ---------- music (generative chill loop, no assets) ---------- */
/* A 4-chord C-major loop (Cmaj7 → Am7 → Fmaj7 → G) scheduled ahead of the
 * audio clock: soft detuned pads, a round sine bass and sparse pentatonic
 * plucks, all on a separate bus so the MUSIC and SOUND toggles stay
 * independent. Starts on the first tap (WebView autoplay rules). */
const Mus = {
  on: store.get('music', true),
  playing: false, timer: null, bus: null, lp: null, nextT: 0, bar: 0,
  BPM: 76,
  PROG: [   // semitones from C4: bass root, pad voicing, pluck palette
    { bass: -24, pad: [-12, -8, -5, -1], arp: [0, 4, 7, 11, 14] },
    { bass: -27, pad: [-15, -12, -8, -5], arp: [-3, 0, 4, 7, 12] },
    { bass: -19, pad: [-19, -15, -12, -8], arp: [-3, 0, 5, 9, 12] },
    { bass: -17, pad: [-17, -13, -10, -5], arp: [-1, 2, 7, 11, 14] },
  ],
  freq(n) { return 261.626 * Math.pow(2, n / 12); },
  ensure() {
    if (!Aud.ensure()) return false;
    if (!this.bus) {
      this.bus = Aud.ctx.createGain();
      this.bus.gain.value = 0;
      this.lp = Aud.ctx.createBiquadFilter();
      this.lp.type = 'lowpass'; this.lp.frequency.value = 2600; this.lp.Q.value = 0.4;
      this.bus.connect(this.lp); this.lp.connect(Aud.ctx.destination);
    }
    return true;
  },
  note(n, t, dur, peak, type) {
    const o = Aud.ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(this.freq(n), t);
    const g = Aud.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.06, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + dur + 0.05);
  },
  pad(n, t, dur) {
    const g = Aud.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.021, t + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.06);
    g.connect(this.bus);
    const o1 = Aud.ctx.createOscillator();
    o1.type = 'triangle'; o1.frequency.setValueAtTime(this.freq(n), t);
    const o2 = Aud.ctx.createOscillator();          // shimmer an octave up
    o2.type = 'sine'; o2.frequency.setValueAtTime(this.freq(n + 12), t);
    o2.detune.setValueAtTime(6, t);
    const g2 = Aud.ctx.createGain(); g2.gain.value = 0.4;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o1.stop(t + dur * 1.1);
    o2.start(t); o2.stop(t + dur * 1.1);
  },
  scheduleBar(t) {
    const beat = 60 / this.BPM;
    const ch = this.PROG[this.bar % this.PROG.length];
    this.note(ch.bass, t, beat * 2.4, 0.05, 'sine');
    if (Math.random() < 0.7) this.note(ch.bass + 12, t + beat * 2.5, beat * 1.1, 0.026, 'sine');
    for (const n of ch.pad) this.pad(n, t, beat * 4);
    for (let s = 0; s < 8; s++) {                   // sparse plucked 8ths
      if (Math.random() > 0.55) continue;
      const n = ch.arp[Math.floor(Math.random() * ch.arp.length)] + (Math.random() < 0.25 ? 12 : 0);
      this.note(n, t + s * beat / 2, 0.42, 0.042 + Math.random() * 0.02, 'triangle');
    }
    if (this.bar % 2 === 1) {                       // an occasional far sparkle
      this.note(ch.arp[2] + 24, t + beat * (1 + Math.floor(Math.random() * 2)), 1.2, 0.015, 'sine');
    }
  },
  tick() {
    if (!this.playing || !Aud.ctx) return;
    const barDur = (60 / this.BPM) * 4;
    // after a main-thread stall, skip the missed bars instead of cramming
    // them all into "now" as one discordant burst
    if (this.nextT < Aud.ctx.currentTime) this.nextT = Aud.ctx.currentTime + 0.1;
    while (this.nextT < Aud.ctx.currentTime + 0.9) {
      this.scheduleBar(this.nextT);
      this.nextT += barDur;
      this.bar++;
    }
  },
  start() {
    if (!this.on || this.playing) return;
    // a bar or two may still be scheduled from the previous run (app switch,
    // quick off->on): orphan the old bus so leftovers can't layer under the
    // fresh bars, then build a clean one
    if (this.bus) {
      try { this.bus.disconnect(); } catch (e) {}
      try { this.lp.disconnect(); } catch (e) {}
      this.bus = this.lp = null;
    }
    if (!this.ensure()) return;
    this.playing = true;
    this.nextT = Aud.ctx.currentTime + 0.15;
    this.bus.gain.cancelScheduledValues(Aud.ctx.currentTime);
    this.bus.gain.setTargetAtTime(0.85, Aud.ctx.currentTime, 0.6);
    this.timer = setInterval(() => this.tick(), 240);
    this.tick();
  },
  stop() {
    if (!this.playing) return;
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.bus && Aud.ctx) {
      this.bus.gain.cancelScheduledValues(Aud.ctx.currentTime);
      this.bus.gain.setTargetAtTime(0, Aud.ctx.currentTime, 0.12);
    }
  },
};
document.addEventListener('visibilitychange', () => {
  try {
    if (document.hidden) { Mus.stop(); if (Aud.ctx) Aud.ctx.suspend(); }
    else if (Aud.ctx) { Aud.ctx.resume(); Mus.start(); }
  } catch (e) {}
});

/* ---------- viewport ---------- */
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  CV.width = Math.round(W * DPR); CV.height = Math.round(H * DPR);
  CV.style.width = W + 'px'; CV.style.height = H + 'px';
  CX.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------- game state ---------- */
const G = {
  level: store.get('level', 1),
  coins: store.get('coins', ECON.startCoins),
  coinShown: 0,                       // animated counter
  streak: store.get('streak', 0),     // consecutive 3-star clears
  state: null, view: null,
  solution: null, solStep: 0, deviated: false,
  sel: -1, selT: 0,
  undoStack: [],
  undos: 0, restarted: false, hints: 0, vials: 0, shuffles: 0,
  phase: 'play',                      // play | anim | win
  lockT: 0,                           // input lock (level intro)
  winT: 0, winData: null,
  firstFusionSeen: store.get('fusionSeen', false),
  slots: [], pop: [],                 // per-flask spawn time (intro bounce)
  pulse: [],                          // per-flask squash pulse
  hint: null, hintT: 0, idleT: 0,
  denyF: -1, denyT: 0,
  shake: 0, shakeT: 0, t: 0,
  bannerT: 0, flash: 0,
  hard: false, par: 0, gift: null, giftT: 0,
  moves: 0, levelT0: 0,
  account: false,
  aquarium: false, shop: false, ad: null, fishDetail: null, newFish: null, consent: false,
  settings: false, album: false, decorShop: false, tankDone: null, starPop: 0,
};
G.coinShown = G.coins;

/* Level Foundry — infinite levels. The first packSize() levels come from the
   curated pack; beyond that the SAME bot-playtesting pipeline runs on-device:
   the next level is pre-brewed in idle frames and cached, so loads stay
   instant. Deterministic in n — every player gets the same level N. */
const Foundry = {
  job: null, jobN: 0,
  cacheGet(n) { const c = store.get('foundry', null); return c && c.n === n ? c.data : null; },
  cachePut(n, data) { store.set('foundry', { n, data }); },
  wantN() { const next = G.level + 1; return next > PF.packSize() ? next : 0; },
  tick() {
    const n = this.wantN();
    if (!n || this.cacheGet(n)) { this.job = null; return; }
    if (!this.job || this.jobN !== n) { this.job = PF.smith.makeJob(n, PF.smith.FAST); this.jobN = n; }
    try {
      if (this.job.step()) {
        this.cachePut(n, this.job.result());
        this.job = null;
        PFA.track('foundry_brew', { level: n, mode: 'idle' });
      }
    } catch (e) { this.job = null; }
  },
};
function getLevelSmart(n) {
  try {
    if (n <= PF.packSize()) return PF.genLevel(n);
    const cached = Foundry.cacheGet(n);
    if (cached) return PF.smith.inflate(cached, n);
    const t0 = Date.now();
    const job = PF.smith.makeJob(n, PF.smith.FAST);
    while (!job.step()) { /* rare synchronous brew if the player outran the foundry */ }
    const data = job.result();
    Foundry.cachePut(n, data);
    PFA.track('foundry_brew', { level: n, mode: 'sync', ms: Date.now() - t0 });
    return PF.smith.inflate(data, n);
  } catch (e) {
    return PF.genLevel(n);
  }
}

function loadLevel(n, quiet) {
  const gen = getLevelSmart(n);
  G.state = gen.state;
  G.view = PF.cloneState(gen.state);
  G.solution = gen.solution || [];
  G.hard = !!gen.hard;
  G.par = gen.par || G.solution.length;
  G.solStep = 0; G.deviated = false;
  G.sel = -1; G.undoStack = [];
  G.undos = 0; G.restarted = false; G.hints = 0; G.vials = 0; G.shuffles = 0; G.powers = 0;
  G.arm = null;
  G.phase = 'play'; G.hint = null; G.idleT = 0; G.winData = null;
  G.moves = 0; G.stuckHinted = false;
  G.levelT0 = Date.now();
  // quiet = booting behind a menu: level_start fires when play actually
  // begins; levelStarted keeps a menu-pause resume from double-counting
  G.levelStarted = !quiet;
  if (!quiet) PFA.track('level_start', { level: n, hard: G.hard ? 1 : 0, par: G.par });
  G.pop = G.state.flasks.map((f, i) => -i * 0.06);
  G.pulse = G.state.flasks.map(() => 0);
  G.lockT = 0.5 + G.state.flasks.length * 0.06;
  anims.length = 0; parts.length = 0; toasts.length = 0; floats.length = 0; rings.length = 0; coinFly.length = 0;
  G.bannerT = 1.8;
  layout();
  if (!quiet) levelIntroToasts(n);
}

/* ---------- layout ---------- */
function layout() {
  if (!G.state) return;
  const flasks = G.view.flasks;
  const orders = [], work = [];
  flasks.forEach((f, i) => (f.order ? orders : work).push(i));
  const colW = Math.min(W, 540);
  const x0 = (W - colW) / 2;
  const hud = 108;
  const barH = 104; // bottom booster bar
  const perRow = work.length <= 4 ? Math.max(2, work.length) : work.length <= 8 ? 4 : Math.ceil(work.length / 2);
  const rows = Math.ceil(work.length / perRow) || 1;
  const oW = Math.min(84, (colW - 40) / Math.max(orders.length, 1) - 14);
  const oH = oW * 1.26;
  const shelfH = oH + 64;
  let tw = Math.min(64, (colW - 32) / perRow - 14);
  let th = tw * 2.55;
  const availH = H - hud - shelfH - 30 - barH - rows * 26;
  if (rows * th > availH) { th = availH / rows; tw = Math.min(tw, th / 2.3); }
  G.slots = new Array(flasks.length);
  const oTotW = orders.length * (oW + 18) - 18;
  orders.forEach((fi, k) => {
    G.slots[fi] = { x: x0 + colW / 2 - oTotW / 2 + k * (oW + 18), y: hud + 34, w: oW, h: oH, kind: 'order' };
  });
  const yW0base = hud + shelfH + 10;
  const availableH = H - yW0base - barH - 10;
  const rowH = Math.min(availableH / rows, th + 46);
  const yW0 = yW0base + Math.max(0, (availableH - rowH * rows) * 0.30);
  work.forEach((fi, k) => {
    const r = Math.floor(k / perRow);
    const inRow = Math.min(perRow, work.length - r * perRow);
    const totW = inRow * (tw + 16) - 16;
    const cIdx = k - r * perRow;
    G.slots[fi] = {
      x: x0 + colW / 2 - totW / 2 + cIdx * (tw + 16),
      y: yW0 + r * rowH + Math.max(0, (rowH - th) / 2) - 4,
      w: tw, h: th, kind: 'tube',
    };
  });
}

/* ---------- FX pools ---------- */
const parts = [], toasts = [], floats = [], rings = [], coinFly = [];
function burst(x, y, colors, n, spd, up) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.35 + Math.random() * 0.65) * spd;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0),
      r: 2 + Math.random() * 3.2, life: 1, decay: 1.4 + Math.random() * 1.2,
      col: colors[i % colors.length], grav: 260 });
  }
}
function confetti() {
  for (let i = 0; i < 110; i++) {
    parts.push({ x: Math.random() * W, y: -12 - Math.random() * H * 0.4,
      vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140,
      r: 3 + Math.random() * 4.5, life: 1, decay: 0.20, grav: 30,
      col: Object.values(PAL)[i % 6], sq: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8 });
  }
}
function toast(msg, dur) { toasts.push({ msg, life: dur || 2.2, max: dur || 2.2 }); if (toasts.length > 2) toasts.shift(); }
function floatText(x, y, text, col, size) {
  floats.push({ x, y, text, col: col || '#fff', size: size || 17, life: 1, vy: -46 });
}
function ring(x, y, col) { rings.push({ x, y, r: 6, life: 1, col }); }
function shakeIt(p) { G.shake = Math.max(G.shake, p); G.shakeT = 0; }
function flyCoins(x, y, n) {
  for (let i = 0; i < n; i++) {
    coinFly.push({ x, y, sx: x + (Math.random() - 0.5) * 70, sy: y + (Math.random() - 0.5) * 40,
      t: -i * 0.06, dur: 0.55 + Math.random() * 0.2 });
  }
}

/* ---------- animation queue ---------- */
const anims = [];
function startPour(from, to, info, postState, completedOrder) {
  G.phase = 'anim';
  const perUnit = info.kind === 'fusion' ? 0.20 : 0.13;
  anims.push({ type: 'pour', from, to, info, postState, completedOrder,
    t: 0, lift: 0.16, unitI: 0, perUnit, total: 0.16 + info.count * perUnit + 0.16 });
}

function stepAnims(dt) {
  if (!anims.length) return;
  const a = anims[0];
  a.t += dt;
  if (a.type !== 'pour') return;
  const tIn = a.t - a.lift;
  while (a.unitI < a.info.count && tIn > a.unitI * a.perUnit) {
    const s = G.view.flasks[a.from], d = G.view.flasks[a.to];
    const sl = G.slots[a.to];
    if (a.info.kind === 'transfer') {
      d.units.push(s.units.pop());
      G.pulse[a.to] = 1;
      Aud.glug(a.unitI);
      if (d.order) { Aud.deliver(); hapt(12); }
    } else {
      s.units.pop();
      let idx = d.units.length - 1;
      for (let q = d.units.length - 1; q >= 0; q--) { if (d.units[q] === a.info.other) { idx = q; break; } }
      d.units[idx] = a.info.mixColor;
      const uy = liquidY(sl, idx);
      burst(sl.x + sl.w / 2, uy, [PAL[a.info.color], PAL[a.info.other], PAL[a.info.mixColor], '#ffffff'], 30, 170, 60);
      ring(sl.x + sl.w / 2, uy, PAL[a.info.mixColor]);
      G.pulse[a.to] = 1;
      shakeIt(4.5);
      G.flash = Math.max(G.flash, 0.5);
      Aud.fuse(); hapt(30);
      if (a.unitI === 0) floatText(sl.x + sl.w / 2, uy - 26, PF.NAMES[a.info.mixColor] + '!', PAL[a.info.mixColor], 19);
      store.set('fusions', (store.get('fusions', 0)) + 1);
      if (!G.firstFusionSeen) {
        G.firstFusionSeen = true; store.set('fusionSeen', true);
        toast('FUSION! Two potions became ' + PF.NAMES[a.info.mixColor] + '!', 2.8);
      }
    }
    a.unitI++;
  }
  if (a.t >= a.total) {
    anims.shift();
    G.view = PF.cloneState(a.postState);
    if (a.info.kind === 'fusion' && a.info.count >= 2) {
      const tier = Math.min(a.info.count - 2, 2);
      const words = ['GREAT!', 'AMAZING!', 'INCREDIBLE!'];
      floats.push({ x: W / 2, y: H * 0.40, text: words[tier], col: [PAL.Y, PAL.O, PAL.P][tier],
                    size: 30 + tier * 5, life: 1.15, vy: -22, big: true });
      Aud.praise(tier);
    }
    if (a.completedOrder) {
      const sl = G.slots[a.to];
      burst(sl.x + sl.w / 2, sl.y + 8, ['#ffffff', PAL[a.postState.flasks[a.to].order]], 34, 200, 130);
      floatText(sl.x + sl.w / 2, sl.y - 12, 'DELIVERED!', '#fff', 16);
      const flakes = G.hard ? 2 : 1;
      AQ.food += flakes; saveAq();
      floatText(sl.x + sl.w / 2, sl.y - 40, '+' + flakes + ' FISH FOOD', '#5ee7d4', 14);
      PRESS['aquarium'] = 1;
      Aud.cork(); hapt(45); shakeIt(3);
    }
    if (!anims.length) {
      if (PF.isWon(G.state)) beginWin();
      else { G.phase = 'play'; checkDead(); }
    }
  }
}

function checkDead() {
  if (!PF.materialOk(G.state)) { toast('Not enough potion left — UNDO or RESTART', 3.0); Aud.deny(); return; }
  if (!PF.legalMoves(G.state).length) { toast('No moves left — UNDO or RESTART', 3.0); Aud.deny(); }
}

/* ---------- economy ---------- */
function stars3() {
  const boosted = G.vials || G.shuffles || G.powers;
  if (!G.undos && !G.restarted && !boosted) return 3;
  if (!G.restarted && !boosted) return 2;
  return 1;
}
function beginWin() {
  G.phase = 'win'; G.winT = 0;
  const stars = stars3();
  if (stars === 3) G.streak++; else G.streak = 0;
  store.set('streak', G.streak);
  const lines = [['Level clear', ECON.base]];
  if (stars === 3) lines.push(['Perfect', ECON.perfect]);
  if (G.streak >= 2) lines.push(['Streak ×' + G.streak, Math.min(ECON.streakPer * G.streak, ECON.streakCap)]);
  if (G.hard) lines.push(['HARD level ×2', lines.reduce((s, l) => s + l[1], 0)]);
  const total = lines.reduce((s, l) => s + l[1], 0);
  G.winData = { stars, lines, total, granted: false, starsShown: 0,
    offerX2: adsLeftToday() > 0 && PFRC.flag('x2_enabled', true) };
  PFA.track('level_complete', {
    level: G.level, hard: G.hard ? 1 : 0, stars, moves: G.moves, par: G.par,
    duration_s: Math.max(0, Math.round((Date.now() - G.levelT0) / 1000)),
    undos: G.undos, hints: G.hints, vials: G.vials, shuffles: G.shuffles, powers: G.powers,
    balance: G.coins,
  });
  PFA.flush();
  if ((G.level === 1 || G.level % 5 === 0) && AQ.fish.length < 16) {
    const nf = newFish('level');
    AQ.fish.push(nf); saveAq();
    G.winData.newFish = nf;
    PFA.track('fish_granted', { level: G.level, species: PFFish.speciesName(nf),
      rarity: PFFish.RARITY[PFFish.SPECIES[nf.sp].rarity].name, source: 'level', first: nf.fresh ? 1 : 0 });
  }
  confetti(); Aud.win(); hapt(70);
  store.set('level', G.level + 1);
  if (G.level >= store.get('best', 1)) store.set('best', G.level + 1);
}
function spendCoins(n) {
  if (G.coins < n) return false;
  G.coins -= n; store.set('coins', G.coins);
  G.pillPulse = 1;
  return true;
}

/* ---------- interactions ---------- */
function flaskAt(x, y) {
  for (let i = 0; i < G.slots.length; i++) {
    const s = G.slots[i];
    if (!s) continue;
    const pad = 16;
    if (x >= s.x - pad && x <= s.x + s.w + pad && y >= s.y - 30 && y <= s.y + s.h + pad) return i;
  }
  return -1;
}

function tapFlask(i) {
  const st = G.state;
  const f = st.flasks[i];
  if (G.arm) { usePower(i); return; }
  if (G.sel === -1) {
    if (f.order) { toast(PF.NAMES[f.order] + ' order — pour ' + PF.NAMES[f.order] + ' in', 1.8); Aud.click(); return; }
    if (!f.units.length) { Aud.click(); return; }
    G.sel = i; G.selT = 0; Aud.click(); hapt(8);
    return;
  }
  if (G.sel === i) { G.sel = -1; Aud.click(); return; }
  const res = PF.applyMove(st, G.sel, i);
  if (!res) {
    const info = PF.moveInfo(st, G.sel, i);
    if (info.reason === 'order-color') toast('Only ' + PF.NAMES[info.want] + ' fits this order', 2.0);
    else if (info.reason === 'no-mix') toast(PF.NAMES[info.got] + ' + ' + PF.NAMES[info.top] + " don't mix", 2.0);
    else if (info.reason === 'full') toast('That flask is full', 1.6);
    else if (info.reason === 'order-done') toast('Order complete!', 1.4);
    Aud.deny(); hapt(18);
    G.denyF = i; G.denyT = 0.35;
    G.sel = -1;
    return;
  }
  const expected = !G.deviated && G.solution[G.solStep];
  if (expected && expected[0] === G.sel && expected[1] === i) G.solStep++;
  else G.deviated = true;
  G.undoStack.push(PF.cloneState(st));
  G.moves++;
  const from = G.sel;
  G.sel = -1; G.hint = null; G.idleT = 0;
  G.state = res.state;
  startPour(from, i, res.info, res.state, res.completedOrder);
}

function doUndo() {
  if (G.phase !== 'play' || !G.undoStack.length) { Aud.deny(); return; }
  G.state = G.undoStack.pop();
  G.view = PF.cloneState(G.state);
  // a bought vial stays through undo (older snapshots may lack it)
  while (G.pop.length > G.view.flasks.length) { G.pop.pop(); G.pulse.pop(); }
  while (G.pop.length < G.view.flasks.length) { G.pop.push(1); G.pulse.push(0); }
  layout();
  G.sel = -1; G.undos++; G.deviated = true; G.hint = null;
  Aud.click(); hapt(10);
}
function doRestart() {
  if (G.phase === 'anim') return;
  PFA.track('level_restart', { level: G.level, moves: G.moves });
  const lvl = G.level;
  loadLevel(lvl);
  G.restarted = true;
  Aud.click(); hapt(10);
}
/* ---------- powerups: arm, then tap a flask ---------- */
const POWERS = {
  pipette:  { name: 'PIPETTE',  cost: () => ECON.pipetteCost,
              prompt: 'Tap a flask to draw off its top drop' },
  catalyst: { name: 'CATALYST', cost: () => ECON.catalystCost,
              prompt: 'Tap a fused drop to split it back apart' },
};
function armPower(kind) {
  if (G.phase !== 'play') return;
  if (G.arm === kind) { G.arm = null; Aud.click(); return; }
  const targets = PF.powerTargets(G.state, kind);
  if (!targets.length) {
    toast(kind === 'catalyst' ? 'Nothing fused to split right now' : 'Nothing to draw off yet', 2.0);
    Aud.deny(); return;
  }
  if (G.coins < POWERS[kind].cost()) { noCoins(); return; }
  G.arm = kind; G.sel = -1; G.hint = null; G.idleT = 0;
  toasts.length = 0;              // the prompt strip says it; no double message
  Aud.click(); hapt(8);
}
function usePower(i) {
  const kind = G.arm;
  const P = POWERS[kind];
  if (!P) return;
  const res = kind === 'catalyst' ? PF.applyCatalyst(G.state, i) : PF.applyPipette(G.state, i);
  if (!res) {
    const info = kind === 'catalyst' ? PF.catalystInfo(G.state, i) : PF.pipetteInfo(G.state, i);
    toast(info.reason === 'primary' ? PF.NAMES[info.got] + ' is already pure — nothing to split'
      : info.reason === 'full' ? 'No room to split into — pour one off first'
      : info.reason === 'order-oneway' ? 'Order flasks are sealed'
      : 'Nothing there to draw off', 2.2);
    Aud.deny(); hapt(18);
    G.denyF = i; G.denyT = 0.35;
    return;
  }
  if (!spendCoins(P.cost())) { noCoins(); G.arm = null; return; }
  coinSpendFx(P.cost());
  G.undoStack.push(PF.cloneState(G.state));
  G.state = res.state;
  G.view = PF.cloneState(res.state);
  G.powers++; G.arm = null; G.deviated = true; G.hint = null; G.idleT = 0;
  G.pulse[i] = 1;
  PFA.track('power_used', { power: kind, cost: P.cost(), level: G.level,
    color: res.info.color, balance: G.coins });
  const sl = G.slots[i];
  if (sl) {
    const cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2;
    if (kind === 'catalyst') {
      burst(cx, cy, [PAL[res.info.into[0]], PAL[res.info.into[1]], '#ffffff'], 22, 150, 40);
      floatText(cx, sl.y - 6, 'SPLIT!', PAL[res.info.color], 17);
    } else {
      burst(cx, cy, [PAL[res.info.color] || '#ffffff', '#ffffff'], 14, 120, 60);
      floatText(cx, sl.y - 6, 'SIPHON', '#9fd4ff', 16);
    }
  }
  G.flash = Math.max(G.flash, 0.4);
  Aud.pop(); hapt(22);
  if (PF.isWon(G.state)) beginWin();
}
function doVial() {
  if (G.phase !== 'play') return;
  if (G.vials >= ECON.vialMax) { toast('Vial limit reached for this level', 1.8); Aud.deny(); return; }
  if (!spendCoins(ECON.vialCost)) { noCoins(); return; }
  coinSpendFx(ECON.vialCost);
  G.vials++;
  PFA.track('booster_spend', { booster: 'vial', cost: ECON.vialCost, level: G.level, balance: G.coins });
  G.state.flasks.push(PF.flask([], null));
  G.view.flasks.push(PF.flask([], null));
  G.undoStack.forEach(s => s.flasks.push(PF.flask([], null)));
  G.pop.push(0); G.pulse.push(0);
  G.sel = -1; G.hint = null;
  layout();
  const sl = G.slots[G.slots.length - 1];
  if (sl) burst(sl.x + sl.w / 2, sl.y + sl.h / 2, ['#ffffff', '#9fd4ff'], 18, 140, 40);
  Aud.pop(); hapt(20);
}
function doShuffle() {
  if (G.phase !== 'play') return;
  if (G.coins < ECON.shuffleCost) { noCoins(); return; }
  const work = [];
  G.state.flasks.forEach((f, i) => { if (!f.order) work.push(i); });
  const units = [];
  for (const i of work) units.push.apply(units, G.state.flasks[i].units);
  let found = null;
  for (let attempt = 0; attempt < 14 && !found; attempt++) {
    const cand = PF.cloneState(G.state);
    const bag = units.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
    for (const i of work) cand.flasks[i].units = [];
    let wi = Math.floor(Math.random() * work.length);
    for (const u of bag) {
      let guard = 0;
      while (cand.flasks[work[wi % work.length]].units.length >= 4 && guard++ <= work.length) wi++;
      cand.flasks[work[wi % work.length]].units.push(u);
      wi++;
    }
    if (PF.stateKey(cand) === PF.stateKey(G.state)) continue;
    if (PF.materialOk(cand) && PF.solve(cand, { maxNodes: 30000, maxDepth: 56 })) found = cand;
  }
  if (!found) { toast('No luck — try UNDO instead', 2.0); Aud.deny(); return; }
  spendCoins(ECON.shuffleCost);
  coinSpendFx(ECON.shuffleCost);
  G.shuffles++;
  PFA.track('booster_spend', { booster: 'shuffle', cost: ECON.shuffleCost, level: G.level, balance: G.coins });
  G.undoStack.push(PF.cloneState(G.state));
  G.state = found;
  G.view = PF.cloneState(found);
  G.sel = -1; G.hint = null;
  for (let i = 0; i < G.pulse.length; i++) G.pulse[i] = 1;
  G.flash = Math.max(G.flash, 0.5);
  for (const i of work) {
    const sl = G.slots[i];
    if (sl) burst(sl.x + sl.w / 2, sl.y + sl.h / 2, ['#ffffff', '#54d9e8'], 6, 130, 40);
  }
  Aud.buy(); hapt(25);
}
function noCoins() {
  toast('Not enough coins — earn some in the shop!', 2.2);
  Aud.deny(); hapt(18);
  G.coinDeny = 0.4;
  G.shop = true;
  PFA.track('shop_open', { source: 'no_coins' });
}
function coinSpendFx(n) {
  const p = coinPillPos();
  floatText(p.x + p.w / 2, p.y + 34, '-' + n, '#ff8091', 15);
}
function toggleSound() { Aud.on = !Aud.on; store.set('sound', Aud.on); if (Aud.on) { Aud.ensure(); Aud.click(); } PFA.track('settings_change', { key: 'sound', on: Aud.on ? 1 : 0 }); }
function toggleMusic() {
  Mus.on = !Mus.on; store.set('music', Mus.on);
  if (Mus.on) Mus.start(); else Mus.stop();
  Aud.click();
  PFA.track('settings_change', { key: 'music', on: Mus.on ? 1 : 0 });
}
function toggleHaptics() {
  hapt.on = !hapt.on; store.set('haptics', hapt.on);
  Aud.click(); if (hapt.on) hapt(20);
  PFA.track('settings_change', { key: 'haptics', on: hapt.on ? 1 : 0 });
}

/* ---------- HUD geometry ---------- */
function colX0() { return (W - Math.min(W, 540)) / 2; }
function coinPillPos() { const cw = 148; return { x: colX0() + Math.min(W, 540) - cw - 14, y: 14, w: cw, h: 44 }; }
let BTNS = [];
const PRESS = {};
function computeButtons() {
  // Genre-standard placement (Water Sort / Royal Match / Fishdom):
  // - boosters: compact icon squares in the bottom thumb-zone tray
  // - shop: the coin pill itself (green "+" cap), top right
  // - aquarium: square meta-feature tile pinned bottom-RIGHT with a badge
  const cp = coinPillPos();
  const colW = Math.min(W, 540), x0 = colX0();
  const ts = 62;
  const tileX = x0 + colW - 14 - ts, tileY = H - 83;
  // Touch targets are held at TAP_MIN (44px) or better everywhere: below that,
  // thumbs start hitting the neighbour instead.
  const TAP_MIN = 44;
  // top-right circle row, laid out from the right edge so adding the profile
  // button cannot shove the gear off-screen
  const cr = TAP_MIN / 2, cgap = 10, cy = 84;
  const circles = (PFAuth.available() ? ['profile', 'restart', 'settings'] : ['restart', 'settings']);
  const circleX = {};
  circles.slice().reverse().forEach((id, k) => {
    circleX[id] = x0 + colW - 14 - cr - k * (cr * 2 + cgap);
  });
  // tray: UNDO (free, most-used — thumb zone) + two powerups + two boosters
  // (the HINT button retired in v2.7 — idle glow guidance replaced it)
  const inset = 12, gap = 8;
  const avail = tileX - inset - (x0 + inset);
  const bs = Math.max(TAP_MIN, Math.min(58, (avail - gap * 4) / 5));
  const by = tileY + ts - bs;                   // bottoms align with the tile
  const tx = (x0 + inset + tileX - inset) / 2 - (bs * 5 + gap * 4) / 2;
  BTNS = [
    { id: 'shop',     shape: 'r', x: cp.x, y: cp.y, w: cp.w, h: cp.h },
    { id: 'aquarium', shape: 'r', x: tileX, y: tileY, w: ts, h: ts },
    ...(PFAuth.available() ? [{ id: 'profile', shape: 'c', x: circleX.profile, y: cy, r: cr }] : []),
    { id: 'settings', shape: 'c', x: circleX.settings, y: cy, r: cr },
    { id: 'restart', shape: 'c', x: circleX.restart,  y: cy, r: cr },
    { id: 'undo',     shape: 'r', x: tx,                    y: by, w: bs, h: bs },
    { id: 'pipette',  shape: 'r', x: tx + bs + gap,         y: by, w: bs, h: bs, cost: ECON.pipetteCost },
    { id: 'catalyst', shape: 'r', x: tx + (bs + gap) * 2,   y: by, w: bs, h: bs, cost: ECON.catalystCost },
    { id: 'vial',     shape: 'r', x: tx + (bs + gap) * 3,   y: by, w: bs, h: bs, cost: ECON.vialCost },
    { id: 'shuffle',  shape: 'r', x: tx + (bs + gap) * 4,   y: by, w: bs, h: bs, cost: ECON.shuffleCost },
  ];
}
function hitButton(x, y) {
  for (const b of BTNS) {
    if (b.shape === 'c') { if ((x - b.x) ** 2 + (y - b.y) ** 2 <= (b.r + 7) ** 2) return b; }
    else if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4) return b;
  }
  return null;
}

function tapAt(x, y) {
  G.idleT = 0;
  Aud.ensure();
  Mus.start();
  if (G.consent) {
    for (const b of (G._consentBtns || [])) {
      if (hitRect(b, x, y)) {
        const yes = b.id === 'yes';
        PFA.setConsent(yes ? 1 : 0);
        G.consent = false;
        if (yes) {
          PFA.track('consent_choice', { granted: 1 });
          PFA.track('session_start', {
            level: G.level, balance: G.coins, streak: G.streak,
            signed_in: PFAuth.signedIn() ? 1 : 0, late_consent: 1,
          });
          // the boot-time level_start was (correctly) dropped pre-consent;
          // re-emit it so the level funnel stays consistent — but only when
          // a level is actually underway (on the menu it fires at PLAY)
          if (G.phase === 'play' || G.phase === 'anim' || G.phase === 'win') {
            G.levelStarted = true;
            PFA.track('level_start', { level: G.level, hard: G.hard ? 1 : 0, par: G.par });
          }
        }
        Aud.click(); hapt(10);
        return;
      }
    }
    return;   // modal: swallow everything else
  }
  if (G.ad) { adTap(x, y); return; }
  if (G.settings) { settingsTap(x, y); return; }
  if (G.tankDone) { tankAdvance(); return; }
  if (G.fishDetail) { aquariumTap(x, y); return; }
  if (G.decorShop) { decorTap(x, y); return; }
  if (G.album) { albumTap(x, y); return; }
  if (G.aquarium) { aquariumTap(x, y); return; }
  if (G.shop) { shopTap(x, y); return; }
  if (G.phase === 'signin') {
    for (const b of (G._signBtns || [])) {
      if (hitRect(b, x, y)) {
        if (b.id === 'guest') {
          PFAuth.chooseGuest();
          enterAfterGate();
          Aud.buy(); hapt(15);
        } else startProvider(b.id);
        return;
      }
    }
    return;
  }
  if (G.account) {
    const A2 = G._accBtns;
    if (A2) {
      for (const b of A2.btns) {
        if (hitRect(b, x, y)) {
          if (b.id === 'close') { G.account = false; Aud.click(); }
          else if (b.id === 'signout') { PFAuth.signOut(); G.account = false; }
          else startProvider(b.id);
          return;
        }
      }
      if (!hitRect(A2.card, x, y)) { G.account = false; Aud.click(); }
    }
    return;
  }
  if (G.gift && (G.phase === 'menu' || G.phase === 'play')) { claimGift(); return; }
  if (G.phase === 'menu') { menuTap(x, y); return; }
  if (G.bannerT > 0.3 && G.phase === 'play') { G.bannerT = 0.3; return; }
  if (G.lockT > 0) return;
  if (G.phase === 'win') {
    if (G.winT > 0.9) {
      const xb = G._winBtns && G._winBtns.x2;
      if (xb && G.winData && !G.winData.granted && hitRect(xb, x, y)) {
        Aud.click(); hapt(10);
        startAd('win_x2', () => {
          if (G.winData && !G.winData.granted) {
            consumeAd();
            G.winData.lines.push(['Ad bonus ×2', G.winData.total]);
            G.winData.total *= 2;
            G.winData.x2 = true;
            Aud.win(); hapt(30);
            grantWinCoins();
          }
        });
        return;
      }
      if (G.winData && !G.winData.granted) grantWinCoins();
      else if (!coinFly.length) { G.level++; store.set('level', G.level); loadLevel(G.level); }
    }
    return;
  }
  const b = hitButton(x, y);
  if (b) {
    PRESS[b.id] = 1;
    if (b.id === 'aquarium') {
      if (G.phase !== 'play') return;
      G.aquarium = true; toasts.length = 0; reapStarved(); swimInit(); AquaGL.show(); Aud.click(); hapt(8);
      PFA.track('aquarium_open', { fish: AQ.fish.length, food: AQ.food, hungry: hungryCount() });
      return;
    }

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) {
  CX.beginPath();
  CX.moveTo(x + r, y);
  CX.arcTo(x + w, y, x + w, y + h, r);
  CX.arcTo(x + w, y + h, x, y + h, r);
  CX.arcTo(x, y + h, x, y, r);
  CX.arcTo(x, y, x + w, y, r);
  CX.closePath();
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
/* candy-UI kit: outlined gradient type, chunky 2.5D capsules, rays, ribbon */
function outlinedText(txt, x, y, size, top, bottom, outline, align) {
  CX.save();
  CX.font = fnt(800, size);
  CX.textAlign = align || 'center';
  CX.lineJoin = 'round';
  CX.lineWidth = Math.max(3, size * 0.17);
  CX.strokeStyle = outline || 'rgba(24,16,44,0.92)';
  CX.strokeText(txt, x, y);
  const g = CX.createLinearGradient(0, y - size * 0.9, 0, y + size * 0.25);
  g.addColorStop(0, top); g.addColorStop(1, bottom || top);
  CX.fillStyle = g;
  CX.fillText(txt, x, y);
  CX.restore();
}
function chunkyCapsule(x, y, w, h, r, top, bottom, lip, pressed) {
  const dy = pressed ? 2.5 : 0;
  CX.save();
  CX.fillStyle = lip;
  rr(x, y + 4, w, h, r); CX.fill();
  const g = CX.createLinearGradient(0, y + dy, 0, y + dy + h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  CX.fillStyle = g;
  rr(x, y + dy, w, h - 1, r); CX.fill();
  CX.globalAlpha = 0.20;
  CX.fillStyle = '#ffffff';
  rr(x + 4, y + dy + 3, w - 8, h * 0.40, Math.min(r * 0.8, h * 0.2)); CX.fill();
  CX.restore();
  return dy;
}
function drawRays(cx, cy, R, col, alpha) {
  CX.save();
  CX.translate(cx, cy);
  CX.rotate(G.t * 0.4);
  CX.fillStyle = col;
  CX.globalAlpha = alpha;
  for (let i = 0; i < 12; i++) {
    CX.rotate(Math.PI / 6);
    CX.beginPath();
    CX.moveTo(0, 0);
    CX.arc(0, 0, R, -0.14, 0.14);
    CX.closePath();
    CX.fill();
  }
  CX.restore();
}
function drawRibbon(cx, cy, w, h, txt, size) {
  CX.save();
  const wing = 24, drop = 8;
  CX.fillStyle = '#a01d43';
  for (const s of [-1, 1]) {
    CX.beginPath();
    const xE = cx + s * (w / 2 + wing);
    CX.moveTo(cx + s * (w / 2 - 10), cy - h / 2 + drop);
    CX.lineTo(xE, cy - h / 2 + drop);
    CX.lineTo(xE - s * h * 0.34, cy + drop);
    CX.lineTo(xE, cy + h / 2 + drop);
    CX.lineTo(cx + s * (w / 2 - 10), cy + h / 2 + drop);
    CX.closePath(); CX.fill();
  }
  const g = CX.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
  g.addColorStop(0, '#ff5f7e'); g.addColorStop(0.5, '#e8355f'); g.addColorStop(1, '#c92a55');
  CX.fillStyle = g;
  rr(cx - w / 2, cy - h / 2, w, h, 13); CX.fill();
  CX.strokeStyle = '#ffd27a'; CX.lineWidth = 2.5;
  rr(cx - w / 2, cy - h / 2, w, h, 13); CX.stroke();
  CX.globalAlpha = 0.18; CX.fillStyle = '#fff';
  rr(cx - w / 2 + 5, cy - h / 2 + 4, w - 10, h * 0.4, 9); CX.fill();
  CX.globalAlpha = 1;
  outlinedText(txt, cx, cy + size * 0.36, size, '#ffffff', '#ffe3ea', 'rgba(96,10,38,0.95)');
  CX.restore();
}
function drawCoin(x, y, r) {
  const g = CX.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.2, x, y, r);
  g.addColorStop(0, '#ffe793'); g.addColorStop(0.55, GOLD); g.addColorStop(1, GOLD_D);
  CX.fillStyle = g;
  CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.fill();
  CX.strokeStyle = 'rgba(120,70,0,0.55)';
  CX.lineWidth = Math.max(1, r * 0.16);
  CX.beginPath(); CX.arc(x, y, r * 0.68, 0, 7); CX.stroke();
  CX.fillStyle = 'rgba(255,255,255,0.85)';
  CX.beginPath(); CX.arc(x - r * 0.3, y - r * 0.35, r * 0.16, 0, 7); CX.fill();
}
function drawStar(cx, cy, r, fill, dim) {
  CX.save();
  CX.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5, a2 = a + Math.PI / 5;
    CX[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    CX.lineTo(cx + Math.cos(a2) * r * 0.45, cy + Math.sin(a2) * r * 0.45);
  }
  CX.closePath();
  if (dim) { CX.fillStyle = 'rgba(120,80,170,0.22)'; CX.fill(); }
  else {

    CX.shadowBlur = 0;
    CX.strokeStyle = 'rgba(255,255,255,0.5)'; CX.lineWidth = 1.4; CX.stroke();

function flaskInterior(s) {
  const { x, y, w, h } = s;
  CX.beginPath();
  if (s.kind === 'tube') {
    const r = w / 2;
    CX.moveTo(x, y);
    CX.lineTo(x, y + h - r);
    CX.arc(x + r, y + h - r, r, Math.PI, 0, true);
    CX.lineTo(x + w, y);
  } else {
    const neck = w * 0.34;
    const nx = x + (w - neck) / 2;
    const bodyY = y + h * 0.30;
    CX.moveTo(nx, y);
    CX.lineTo(nx, bodyY);
    CX.lineTo(x, y + h - 7);
    CX.quadraticCurveTo(x, y + h, x + 7, y + h);
    CX.lineTo(x + w - 7, y + h);
    CX.quadraticCurveTo(x + w, y + h, x + w, y + h - 7);
    CX.lineTo(nx + neck, bodyY);
    CX.lineTo(nx + neck, y);
  }
}
function liquidY(s, unitIdx) {
  const layerH = (s.h - 6) / CAP;
  return s.y + s.h - 3 - layerH * (unitIdx + 0.5);
}
function drawGlyph(cx, cy, r, g, alpha) {
  CX.save();
  CX.globalAlpha = alpha;
  CX.fillStyle = '#ffffff';
  CX.beginPath();
  if (g === 'dot') { CX.arc(cx, cy, r * 0.55, 0, 7); CX.fill(); }
  else if (g === 'tri') { CX.moveTo(cx, cy - r * 0.7); CX.lineTo(cx + r * 0.66, cy + r * 0.5); CX.lineTo(cx - r * 0.66, cy + r * 0.5); CX.closePath(); CX.fill(); }
  else if (g === 'sq') { CX.fillRect(cx - r * 0.5, cy - r * 0.5, r, r); }
  else if (g === 'dia') { CX.moveTo(cx, cy - r * 0.7); CX.lineTo(cx + r * 0.6, cy); CX.lineTo(cx, cy + r * 0.7); CX.lineTo(cx - r * 0.6, cy); CX.closePath(); CX.fill(); }
  else if (g === 'plus') { CX.fillRect(cx - r * 0.6, cy - r * 0.17, r * 1.2, r * 0.34); CX.fillRect(cx - r * 0.17, cy - r * 0.6, r * 0.34, r * 1.2); }
  else if (g === 'star') {
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5, a2 = a + Math.PI / 5;
      CX[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r * 0.75, cy + Math.sin(a) * r * 0.75);
      CX.lineTo(cx + Math.cos(a2) * r * 0.32, cy + Math.sin(a2) * r * 0.32);
    }
    CX.closePath(); CX.fill();
  } else if (g === 'ring') {
    CX.strokeStyle = '#ffffff'; CX.lineWidth = r * 0.32;
    CX.arc(cx, cy, r * 0.5, 0, 7); CX.stroke();
  } else if (g === 'heart') {
    CX.moveTo(cx, cy + r * 0.6);
    CX.bezierCurveTo(cx - r * 0.95, cy - r * 0.15, cx - r * 0.45, cy - r * 0.75, cx, cy - r * 0.25);
    CX.bezierCurveTo(cx + r * 0.45, cy - r * 0.75, cx + r * 0.95, cy - r * 0.15, cx, cy + r * 0.6);
    CX.fill();
  } else if (g === 'leaf') {
    CX.moveTo(cx, cy - r * 0.7);
    CX.quadraticCurveTo(cx + r * 0.75, cy - r * 0.15, cx, cy + r * 0.7);
    CX.quadraticCurveTo(cx - r * 0.75, cy - r * 0.15, cx, cy - r * 0.7);
    CX.fill();
  }
  CX.restore();
}

function drawFlask(i) {
  const f = G.view.flasks[i];
  const s0 = G.slots[i];
  if (!s0) return;
  const a = anims[0];
  if (a && a.type === 'pour' && a.from === i) return; // drawn as the pouring flask
  let s = s0;
  const selected = G.sel === i && G.phase === 'play';
  if (selected) {
    const k = Math.min(1, G.selT / 0.18);
    s = { ...s0, y: s0.y - 12 * easeOutBack(k) };
  }
  if (G.denyF === i && G.denyT > 0) s = { ...s, x: s.x + Math.sin(G.denyT * 55) * 3.2 };

  // intro pop + squash pulse transform
  const pop = Math.max(0, Math.min(1, (G.pop[i] || 1) / 0.34));
  const scale = pop < 1 ? easeOutBack(pop) : 1;
  const pulse = G.pulse[i] || 0;
  const selS = selected ? 1 + 0.05 * Math.min(1, G.selT / 0.18) : 1;
  const sx = (1 + 0.05 * pulse) * selS, sy = (1 - 0.06 * pulse) * selS;
  CX.save();
  const cx = s.x + s.w / 2, cyB = s.y + s.h;
  CX.translate(cx, cyB);
  CX.scale(scale * sx, scale * sy);
  CX.translate(-cx, -cyB);
  if (scale > 0.02) drawFlaskBody(f, s, selected, i);
  CX.restore();
  if (selected) {
    const ax = s.x + s.w / 2, ay = s.y - 32 + Math.sin(G.t * 7) * 4;
    CX.save();
    CX.lineJoin = 'round';
    CX.strokeStyle = 'rgba(96,52,0,0.85)'; CX.lineWidth = 4;
    CX.beginPath();
    CX.moveTo(ax - 9, ay - 10); CX.lineTo(ax + 9, ay - 10); CX.lineTo(ax, ay + 2);
    CX.closePath(); CX.stroke();
    const g = CX.createLinearGradient(0, ay - 10, 0, ay + 2);
    g.addColorStop(0, '#ffe793'); g.addColorStop(1, '#ffb43d');
    CX.fillStyle = g; CX.fill();
    CX.restore();
  }
}

function drawFlaskBody(f, s, selected, idx) {
  const done = f.done;
  // grounding shadow
  CX.save();
  CX.fillStyle = 'rgba(40,5,90,0.28)';
  CX.beginPath();
  CX.ellipse(s.x + s.w / 2, s.y + s.h + 6, s.w * 0.62, 6.5, 0, 0, 7);
  CX.fill();
  CX.restore();
  if (selected || done) {
    CX.save();
    flaskInterior(s);
    CX.shadowColor = done ? PAL[f.order] : '#8fd8ff';
    CX.shadowBlur = selected ? 30 : 24;
    CX.strokeStyle = selected ? 'rgba(255,255,255,0.40)' : 'rgba(255,255,255,0.12)';
    CX.lineWidth = 3;
    CX.stroke();
    if (selected) CX.stroke();
    CX.restore();
  }
  if (f.order) {
    const col = PAL[f.order];
    CX.save();
    CX.strokeStyle = col;
    CX.globalAlpha = done ? 0.95 : 0.8;
    CX.lineWidth = 2;
    CX.setLineDash(done ? [] : [5, 4]);
    rr(s.x - 7, s.y - 22, s.w + 14, s.h + 34, 10);
    CX.stroke();
    CX.setLineDash([]);
    CX.fillStyle = col;
    CX.font = fnt(800, 10);
    CX.textAlign = 'center';
    const tag = done ? '✓ DONE' : PF.NAMES[f.order];
    const tw = CX.measureText(tag).width + 12;
    rr(s.x + s.w / 2 - tw / 2, s.y - 34, tw, 15, 7);
    CX.fill();
    CX.fillStyle = '#2a1150';
    CX.fillText(tag, s.x + s.w / 2, s.y - 23);
    CX.restore();
  }
  // liquid
  CX.save();
  flaskInterior(s);
  CX.clip();
  const layerH = (s.h - 4) / CAP;
  for (let u = 0; u < f.units.length; u++) {
    const c = f.units[u];
    const ly = s.y + s.h - 2 - layerH * (u + 1);
    const grad = CX.createLinearGradient(0, ly, 0, ly + layerH);
    grad.addColorStop(0, PAL[c]);
    grad.addColorStop(1, PAL_DARK[c]);
    CX.fillStyle = grad;
    CX.fillRect(s.x - s.w, ly, s.w * 3, layerH + 1);
    if (u === f.units.length - 1) {
      // animated wavy surface
      const amp = 1.4 + (G.pulse[idx] || 0) * 3.2;
      CX.save();
      CX.shadowColor = PAL[c]; CX.shadowBlur = 9;
      CX.fillStyle = 'rgba(255,255,255,0.42)';
      CX.beginPath();
      CX.moveTo(s.x - 3, ly + 3.2);
      for (let wx = 0; wx <= s.w + 6; wx += 5) {
        CX.lineTo(s.x - 3 + wx, ly + Math.sin(wx * 0.2 + G.t * 2.4 + idx * 2) * amp);
      }
      CX.lineTo(s.x + s.w + 3, ly + 3.2);
      CX.closePath();
      CX.fill();
      CX.restore();
    }
    drawGlyph(s.x + s.w / 2, ly + layerH / 2, Math.min(7, layerH * 0.3), GLYPH[c], 0.26);
  }
  if (f.units.length && !done) {
    for (let b = 0; b < 2; b++) {
      const ph = (G.t * 0.5 + idx * 1.7 + b * 2.3) % 1;
      const bx = s.x + s.w * (0.3 + 0.4 * Math.sin(idx * 3 + b * 5));
      const byTop = s.y + s.h - 4 - layerH * f.units.length;
      const by = s.y + s.h - 6 - (s.h - 10) * ph * (f.units.length / CAP);
      if (by > byTop + 4) {
        CX.fillStyle = 'rgba(255,255,255,0.20)';
        CX.beginPath(); CX.arc(bx, by, 1.6 + b, 0, 7); CX.fill();
      }
    }
  }
  CX.restore();
  // glass
  flaskInterior(s);
  CX.strokeStyle = done ? PAL[f.order] : 'rgba(255,255,255,0.92)';
  CX.lineWidth = 3.4;
  CX.stroke();
  CX.fillStyle = 'rgba(255,255,255,0.09)';
  flaskInterior(s); CX.fill();
  CX.save();
  flaskInterior(s); CX.clip();
  CX.fillStyle = 'rgba(255,255,255,0.10)';
  CX.fillRect(s.x + s.w * 0.12, s.y + 2, s.w * 0.10, s.h - 6);
  CX.restore();
  CX.strokeStyle = 'rgba(255,255,255,0.97)';
  CX.lineWidth = 4;
  CX.beginPath();
  if (s.kind === 'tube') { CX.moveTo(s.x - 2, s.y); CX.lineTo(s.x + s.w + 2, s.y); }
  else {
    const neck = s.w * 0.34, nx = s.x + (s.w - neck) / 2;
    CX.moveTo(nx - 2, s.y); CX.lineTo(nx + neck + 2, s.y);
  }
  CX.stroke();

    const nx = s.x + (s.w - neck) / 2;
    CX.fillStyle = '#c98d5a';
    rr(nx + 1, s.y - 10, neck - 2, 12, 3);
    CX.fill();
    CX.fillStyle = 'rgba(0,0,0,0.18)';
    rr(nx + 1, s.y - 4, neck - 2, 5, 2);
    CX.fill();
  }
  if (f.order) {
    CX.fillStyle = 'rgba(255,255,255,0.8)';
    CX.font = fnt(800, 13);
    CX.textAlign = 'center';
    CX.fillText(f.units.length + '/4', s.x + s.w / 2, s.y + s.h + 25);
  }
}

function drawPouring() {
  const a = anims[0];
  if (!a || a.type !== 'pour') return;
  const sSrc = G.slots[a.from], sDst = G.slots[a.to];
  const f = G.view.flasks[a.from];
  const prog = Math.min(1, a.t / a.lift);
  const ease = prog < 1 ? 1 - Math.pow(1 - prog, 3) : 1;
  const retreat = a.t > a.total - 0.16 ? (a.t - (a.total - 0.16)) / 0.16 : 0;
  const k = ease * (1 - retreat * retreat);
  const side = sSrc.x < sDst.x ? -1 : 1;
  const hx = sDst.x + sDst.w / 2 + side * (sDst.w * 0.72) - sSrc.w / 2;
  const hy = sDst.y - sSrc.h * 0.72;
  const x = sSrc.x + (hx - sSrc.x) * k;
  const y = sSrc.y + (hy - sSrc.y) * k;
  const ang = side * -1 * (Math.PI * 0.42) * k;
  CX.save();
  CX.translate(x + sSrc.w / 2, y + sSrc.h * 0.85);
  CX.rotate(ang);
  CX.translate(-(sSrc.w / 2), -(sSrc.h * 0.85));
  drawFlaskBody(f, { x: 0, y: 0, w: sSrc.w, h: sSrc.h, kind: sSrc.kind }, false, a.from);
  CX.restore();
  const pouring = a.t > a.lift && a.t < a.total - 0.14 && a.unitI <= a.info.count;
  if (pouring && k > 0.9) {
    const lipY = y + sSrc.h * 0.85 - Math.cos(ang) * sSrc.h * 0.8;
    const tx = sDst.x + sDst.w / 2;
    const fillN = G.view.flasks[a.to].units.length;
    const ty = a.info.kind === 'fusion' ? liquidY(sDst, Math.max(0, fillN - 1)) : sDst.y + sDst.h - 2 - ((sDst.h - 4) / CAP) * fillN;
    CX.save();
    CX.shadowColor = PAL[a.info.color]; CX.shadowBlur = 8;
    CX.strokeStyle = PAL[a.info.color];
    CX.lineWidth = 4;
    CX.lineCap = 'round';
    CX.globalAlpha = 0.92;
    CX.beginPath();
    CX.moveTo(tx + side * 6, Math.min(lipY, ty - 8));
    CX.quadraticCurveTo(tx + side * 2, (Math.min(lipY, ty - 8) + ty) / 2, tx, ty);
    CX.stroke();
    CX.restore();
    if (Math.random() < 0.5) {
      parts.push({ x: tx + (Math.random() - 0.5) * 8, y: ty, vx: (Math.random() - 0.5) * 50, vy: -40 - Math.random() * 40, r: 1.6, life: 0.5, decay: 2.4, col: PAL[a.info.color], grav: 300 });
    }
  }
}

/* ---------- order shelf panel ---------- */
function drawOrderShelf() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, any = false;
  G.view.flasks.forEach((f, i) => {
    if (!f.order || !G.slots[i]) return;
    const s = G.slots[i];
    any = true;
    x0 = Math.min(x0, s.x - 16); x1 = Math.max(x1, s.x + s.w + 16);
    y0 = Math.min(y0, s.y - 42); y1 = Math.max(y1, s.y + s.h + 32);
  });
  if (!any) return;
  CX.save();
  CX.fillStyle = 'rgba(255,255,255,0.10)';
  rr(x0, y0, x1 - x0, y1 - y0, 18); CX.fill();
  CX.strokeStyle = 'rgba(255,255,255,0.35)';
  CX.lineWidth = 2;
  rr(x0, y0, x1 - x0, y1 - y0, 18); CX.stroke();
  CX.restore();
}

/* ---------- level-start goal banner ---------- */
function drawBanner(dt) {
  if (G.bannerT <= 0 || G.phase !== 'play' || G.gift) return;
  G.bannerT -= dt;
  const tIn = 1.8 - G.bannerT;
  const kIn = easeOutBack(Math.min(1, tIn / 0.32));
  const kOut = Math.min(1, G.bannerT / 0.28);
  const a = Math.min(kIn, kOut);
  if (a <= 0) return;
  CX.save();
  CX.globalAlpha = Math.min(1, a);
  CX.fillStyle = 'rgba(40,10,80,0.45)';
  CX.fillRect(0, 0, W, H);
  const cy = H * 0.36;
  CX.translate(W / 2, cy); CX.scale(kIn, kIn); CX.translate(-W / 2, -cy);
  drawRibbon(W / 2, cy - 44, Math.min(W - 150, 230), 46, 'LEVEL ' + G.level, 21);
  const orders = G.state.flasks.filter(f => f.order);
  const pw = Math.min(W - 72, 120 + orders.length * 64), ph = 92;
  CX.fillStyle = '#fff6ea';
  rr(W / 2 - pw / 2, cy - 6, pw, ph, 18); CX.fill();
  CX.strokeStyle = 'rgba(255,255,255,0.95)'; CX.lineWidth = 2.5;
  rr(W / 2 - pw / 2, cy - 6, pw, ph, 18); CX.stroke();
  outlinedText('DELIVER', W / 2, cy + 18, 13, '#a06ae8', '#7b3ff2', 'rgba(0,0,0,0)');
  if (G.hard) {
    chunkyCapsule(W / 2 - 62, cy - 20, 124, 22, 11, '#ff5f7e', '#d81f4a', '#8f1230');
    outlinedText('HARD LEVEL', W / 2, cy - 4, 12, '#ffffff', '#ffd9e2', 'rgba(110,8,40,0.95)');
  }
  const gap = 62, gx0 = W / 2 - (orders.length - 1) * gap / 2;
  orders.forEach((o, i) => {
    const gx = gx0 + i * gap, gy = cy + 52;
    CX.save();
    CX.shadowColor = PAL[o.order]; CX.shadowBlur = 12;
    const g = CX.createLinearGradient(0, gy - 14, 0, gy + 14);
    g.addColorStop(0, PAL[o.order]); g.addColorStop(1, PAL_DARK[o.order]);
    CX.fillStyle = g;
    CX.beginPath(); CX.arc(gx, gy, 15, 0, 7); CX.fill();
    CX.restore();
    CX.strokeStyle = 'rgba(255,255,255,0.75)'; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(gx, gy, 15, 0, 7); CX.stroke();
    drawGlyph(gx, gy, 8, GLYPH[o.order], 0.5);
    outlinedText('×4', gx + 23, gy + 6, 14, '#6b4090', '#53307a', 'rgba(0,0,0,0)', 'left');
  });
  CX.restore();
}

/* ---------- HUD ---------- */
function drawHUD(dt) {
  computeButtons();
  const x0 = colX0();
  // level pill (chunky)
  CX.save();
  const lp = { x: x0 + 14, y: 14, w: 132, h: 42 };
  const lvTxt = 'LEVEL ' + G.level;
  CX.font = fnt(800, 19);
  const lvSize = CX.measureText(lvTxt).width > lp.w - 22 ? 15 : 19;
  const lvY = lp.y + (lvSize === 19 ? 28 : 27);
  if (G.hard) {
    chunkyCapsule(lp.x, lp.y, lp.w, lp.h, 21, '#ff5f7e', '#e8355f', '#8f1230');
    outlinedText(lvTxt, lp.x + lp.w / 2, lvY, lvSize, '#ffffff', '#ffd9e2', 'rgba(110,8,40,0.95)');
  } else {
    chunkyCapsule(lp.x, lp.y, lp.w, lp.h, 21, '#ffffff', '#efe8ff', '#b89ae8');
    outlinedText(lvTxt, lp.x + lp.w / 2, lvY, lvSize, '#7b3ff2', '#5b2be0', 'rgba(0,0,0,0)');
  }
  // chapter progress: 8 levels per chapter, the 8th is the HARD spike
  const chIdx = (G.level - 1) % 8;
  for (let i = 0; i < 8; i++) {
    const dx = lp.x + 10 + i * 15, dy = lp.y + 56;
    if (i === 7) {
      CX.save();
      CX.fillStyle = i <= chIdx ? '#ff5f7e' : 'rgba(255,255,255,0.35)';
      CX.translate(dx, dy); CX.rotate(Math.PI / 4);
      CX.fillRect(-4, -4, 8, 8);
      CX.restore();
    } else {
      CX.fillStyle = i < chIdx ? GOLD : i === chIdx ? '#ffffff' : 'rgba(255,255,255,0.35)';
      CX.beginPath(); CX.arc(dx, dy, i === chIdx ? 5 : 3.5, 0, 7); CX.fill();
      if (i === chIdx) {
        CX.strokeStyle = GOLD; CX.lineWidth = 2;
        CX.beginPath(); CX.arc(dx, dy, 7.5 + Math.sin(G.t * 5) * 1.2, 0, 7); CX.stroke();
      }
    }
  }
  if (G.streak >= 2) {
    outlinedText('×' + G.streak + ' STREAK', lp.x + 134, lp.y + 61, 11, '#ffe36a', '#ffb42e', 'rgba(90,50,0,0.9)', 'left');
  }
  CX.restore();
  // coin pill (chunky)
  const cp = coinPillPos();
  CX.save();
  if (G.coinDeny > 0) { G.coinDeny -= dt; CX.translate(Math.sin(G.coinDeny * 60) * 3, 0); }
  const pillS = 1 + (G.pillPulse || 0) * 0.10;
  CX.translate(cp.x + cp.w / 2, cp.y + cp.h / 2);
  CX.scale(pillS, pillS);
  CX.translate(-(cp.x + cp.w / 2), -(cp.y + cp.h / 2));
  chunkyCapsule(cp.x, cp.y, cp.w, cp.h, 21, '#ffffff', '#efe8ff', '#b89ae8');
  drawCoin(cp.x + 24, cp.y + 21, 15);
  const coinTxt = String(Math.round(G.coinShown));
  const coinFs = coinTxt.length > 4 ? 17 : coinTxt.length > 3 ? 20 : 22;   // never collide with the + cap
  outlinedText(coinTxt, cp.x + 46, cp.y + 29 - (22 - coinFs) * 0.35, coinFs, '#c47510', '#8a5200', 'rgba(0,0,0,0)', 'left');
  // green "+" cap: the coin pill opens the shop (genre standard)
  const plusX = cp.x + cp.w - 20, plusY = cp.y + cp.h / 2;
  const plusR = 13.5 - (PRESS['shop'] || 0) * 1.5;
  CX.fillStyle = '#1f7c31';
  CX.beginPath(); CX.arc(plusX, plusY + 2.5, plusR, 0, 7); CX.fill();
  const pg = CX.createLinearGradient(0, plusY - plusR, 0, plusY + plusR);
  pg.addColorStop(0, '#8df06c'); pg.addColorStop(1, '#38b04b');
  CX.fillStyle = pg;
  CX.beginPath(); CX.arc(plusX, plusY, plusR, 0, 7); CX.fill();
  CX.strokeStyle = '#ffffff'; CX.lineWidth = 3.2; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(plusX - 5.5, plusY); CX.lineTo(plusX + 5.5, plusY);
  CX.moveTo(plusX, plusY - 5.5); CX.lineTo(plusX, plusY + 5.5);
  CX.stroke();
  CX.restore();
  // small round buttons
  for (const b of BTNS) if (b.shape === 'c') drawRoundBtn(b);
  // bottom row: booster tray + aquarium tile
  for (const b of BTNS) {
    if (b.id === 'aquarium') drawAquariumTile(b);
    else if (b.shape === 'r' && b.id !== 'shop') drawBoosterBtn(b, dt);
  }
}
function drawRoundBtn(b) {
  const press = 1 - (PRESS[b.id] || 0) * 0.15;
  CX.save();
  if (b.id === 'undo' && !G.undoStack.length) CX.globalAlpha = 0.5;
  CX.translate(b.x, b.y); CX.scale(press, press); CX.translate(-b.x, -b.y);
  CX.fillStyle = '#b89ae8';
  CX.beginPath(); CX.arc(b.x, b.y + 2.5, b.r, 0, 7); CX.fill();
  const rbg = CX.createLinearGradient(0, b.y - b.r, 0, b.y + b.r);
  rbg.addColorStop(0, '#ffffff'); rbg.addColorStop(1, '#efe8ff');
  CX.fillStyle = rbg;
  CX.strokeStyle = 'rgba(150,110,230,0.35)';
  CX.lineWidth = 1.5;
  CX.beginPath(); CX.arc(b.x, b.y, b.r, 0, 7); CX.fill(); CX.stroke();
  CX.strokeStyle = '#7b3ff2'; CX.fillStyle = '#7b3ff2';
  CX.lineWidth = 2.1; CX.lineCap = 'round';
  if (b.id === 'profile') {
    const u = PFAuth.user();
    if (PFAuth.signedIn() && u) {
      CX.fillStyle = '#7b3ff2';
      CX.beginPath(); CX.arc(b.x, b.y, 10.5, 0, 7); CX.fill();
      CX.fillStyle = '#ffffff';
      CX.font = fnt(800, 13); CX.textAlign = 'center';
      CX.fillText((u.name || 'P').slice(0, 1).toUpperCase(), b.x, b.y + 4.5);
    } else {
      CX.beginPath(); CX.arc(b.x, b.y - 3.5, 4.2, 0, 7); CX.fill();
      CX.beginPath(); CX.arc(b.x, b.y + 8, 7.5, Math.PI + 0.25, -0.25); CX.fill();
    }
  } else if (b.id === 'restart') {
    CX.beginPath(); CX.arc(b.x, b.y, 6, -0.6, 4.6); CX.stroke();
    CX.beginPath(); CX.moveTo(b.x + 8, b.y - 5); CX.lineTo(b.x + 2.6, b.y - 6); CX.lineTo(b.x + 6, b.y - 1); CX.closePath(); CX.fill();
  } else if (b.id === 'settings') {
    CX.save();
    CX.translate(b.x, b.y);
    for (let i = 0; i < 8; i++) {
      CX.save(); CX.rotate(i * Math.PI / 4);
      CX.fillRect(-1.8, -9.6, 3.6, 4.2);
      CX.restore();
    }
    CX.lineWidth = 3.4;
    CX.beginPath(); CX.arc(0, 0, 5.4, 0, 7); CX.stroke();
    CX.restore();
  }
  CX.restore();
}
function drawBoosterBtn(b, dt) {
  if (b.id === 'undo') {
    // free tool: glass face so it reads differently from paid boosters
    const press2 = 1 - (PRESS.undo || 0) * 0.10;
    CX.save();
    const ux = b.x + b.w / 2, uy = b.y + b.h / 2;
    CX.translate(ux, uy); CX.scale(press2, press2); CX.translate(-ux, -uy);
    if (!G.undoStack.length) CX.globalAlpha = 0.45;
    chunkyCapsule(b.x, b.y, b.w, b.h, 18, '#ffffff', '#efe8ff', '#b89ae8');
    CX.strokeStyle = '#7b3ff2'; CX.fillStyle = '#7b3ff2';
    CX.lineWidth = 2.2; CX.lineCap = 'round';
    CX.save();
    CX.translate(ux, uy - 1); CX.scale(1.35, 1.35);
    CX.beginPath(); CX.arc(1, 1, 6, -2.4, 2.2); CX.stroke();
    CX.beginPath(); CX.moveTo(-7.5, -3); CX.lineTo(-1.5, -6.5); CX.lineTo(-2.5, 0.5); CX.closePath(); CX.fill();
    CX.restore();
    CX.restore();
    return;
  }
  const affordable = b.id === 'vial' ? (G.coins >= b.cost && G.vials < ECON.vialMax)
    : b.id === 'pipette' || b.id === 'catalyst'
      ? (G.coins >= b.cost && PF.powerTargets(G.state, b.id).length > 0)
    : G.coins >= b.cost;
  const press = 1 - (PRESS[b.id] || 0) * 0.10;
  CX.save();
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  CX.translate(cx, cy); CX.scale(press, press); CX.translate(-cx, -cy);
  CX.globalAlpha = affordable ? 1 : 0.42;
  const FACES = {
    vial: ['#c07bff', '#8f46e6', '#5c2aa0'],
    shuffle: ['#54d9e8', '#2a9fc0', '#17708c'],
    pipette: ['#9fd4ff', '#4f8fe0', '#28568f'],
    catalyst: ['#ffd23f', '#ff9f2e', '#a86200'],
  };
  const fc = FACES[b.id];
  if (G.arm === b.id) {
    CX.save();
    CX.shadowColor = fc[0]; CX.shadowBlur = 14 + Math.sin(G.t * 7) * 6;
    chunkyCapsule(b.x, b.y, b.w, b.h, 18, fc[0], fc[1], fc[2], true);
    CX.restore();
    CX.strokeStyle = '#ffffff';
    CX.lineWidth = 2.5;
    CX.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 7);
    rr(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 20); CX.stroke();
    CX.globalAlpha = 1;
  } else {
    chunkyCapsule(b.x, b.y, b.w, b.h, 18, fc[0], fc[1], fc[2], (PRESS[b.id] || 0) > 0.4);
  }
  // icon, centered and enlarged (labels live on the badge, genre-standard)
  CX.save();
  CX.strokeStyle = '#ffffff'; CX.fillStyle = '#ffffff';
  CX.lineWidth = 2.2; CX.lineCap = 'round'; CX.lineJoin = 'round';
  CX.translate(b.x + b.w / 2, b.y + b.h / 2 - 3);
  CX.scale(1.35, 1.35);
  const ix = 0, iy = 0;
  if (b.id === 'shuffle') {
    CX.beginPath(); CX.arc(ix, iy, 7.5, -0.35, 2.25); CX.stroke();
    CX.beginPath(); CX.moveTo(ix + 8.6, iy - 5.2); CX.lineTo(ix + 3.0, iy - 7.0); CX.lineTo(ix + 6.6, iy - 1.2); CX.closePath(); CX.fill();
    CX.beginPath(); CX.arc(ix, iy, 7.5, Math.PI - 0.35, Math.PI + 2.25); CX.stroke();
    CX.beginPath(); CX.moveTo(ix - 8.6, iy + 5.2); CX.lineTo(ix - 3.0, iy + 7.0); CX.lineTo(ix - 6.6, iy + 1.2); CX.closePath(); CX.fill();
  } else if (b.id === 'vial') {
    CX.beginPath();
    CX.moveTo(ix - 3.5, iy - 8); CX.lineTo(ix - 3.5, iy - 1); CX.lineTo(ix - 6.5, iy + 6);
    CX.quadraticCurveTo(ix - 7.5, iy + 9, ix - 4.5, iy + 9); CX.lineTo(ix + 4.5, iy + 9);
    CX.quadraticCurveTo(ix + 7.5, iy + 9, ix + 6.5, iy + 6); CX.lineTo(ix + 3.5, iy - 1); CX.lineTo(ix + 3.5, iy - 8);
    CX.stroke();
    CX.beginPath(); CX.moveTo(ix + 9, iy - 6); CX.lineTo(ix + 15, iy - 6); CX.moveTo(ix + 12, iy - 9); CX.lineTo(ix + 12, iy - 3); CX.stroke();
  } else if (b.id === 'pipette') {
    // a dropper with a bulb and a falling drop
    CX.beginPath();
    CX.moveTo(ix - 3, iy - 9); CX.lineTo(ix + 3, iy - 9); CX.lineTo(ix + 3, iy + 1);
    CX.lineTo(ix, iy + 6); CX.lineTo(ix - 3, iy + 1); CX.closePath();
    CX.stroke();
    CX.fillRect(ix - 4.5, iy - 12, 9, 3.5);
    CX.beginPath();
    CX.moveTo(ix, iy + 8.5); CX.quadraticCurveTo(ix + 3, iy + 12, ix, iy + 13.5);
    CX.quadraticCurveTo(ix - 3, iy + 12, ix, iy + 8.5);
    CX.fill();
  } else if (b.id === 'catalyst') {
    // one drop splitting into two
    CX.beginPath();
    CX.moveTo(ix, iy - 10); CX.quadraticCurveTo(ix + 5, iy - 4, ix, iy - 1);
    CX.quadraticCurveTo(ix - 5, iy - 4, ix, iy - 10);
    CX.fill();
    CX.lineWidth = 2;
    CX.beginPath(); CX.moveTo(ix - 1.5, iy + 1); CX.lineTo(ix - 7, iy + 5);
    CX.moveTo(ix + 1.5, iy + 1); CX.lineTo(ix + 7, iy + 5);
    CX.stroke();
    CX.beginPath(); CX.arc(ix - 8.5, iy + 8, 3.2, 0, 7); CX.fill();
    CX.beginPath(); CX.arc(ix + 8.5, iy + 8, 3.2, 0, 7); CX.fill();
  }
  CX.restore();
  // price / state badge hanging off the bottom edge
  const bcx = b.x + b.w / 2, bcy = b.y + b.h - 6;
  CX.font = fnt(800, 11);
  if (b.id === 'vial' && G.vials >= ECON.vialMax) {
    const tw2 = CX.measureText('MAX').width + 16;
    chunkyCapsule(bcx - tw2 / 2, bcy - 9, tw2, 18, 9, '#e7e2f2', '#c9c2dd', '#8f86ab');
    outlinedText('MAX', bcx, bcy + 4.5, 11, '#5c5478', '#4a436a', 'rgba(0,0,0,0)');
  } else {
    CX.font = fnt(800, 12);
    const tw2 = CX.measureText(String(b.cost)).width + 30;
    chunkyCapsule(bcx - tw2 / 2, bcy - 9.5, tw2, 19, 9.5, '#fff6e0', '#ffe9b8', '#d9a860');
    drawCoin(bcx - tw2 / 2 + 12, bcy, 7);
    outlinedText(String(b.cost), bcx - tw2 / 2 + 21, bcy + 4.5, 12, '#c47510', '#8a5200', 'rgba(0,0,0,0)', 'left');
  }
  CX.restore();
}

function drawAquariumTile(b) {
  const press = 1 - (PRESS['aquarium'] || 0) * 0.12;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  CX.save();
  CX.translate(cx, cy); CX.scale(press, press); CX.translate(-cx, -cy);
  // attention pulse while food is waiting
  if (AQ.food > 0) {
    CX.strokeStyle = '#5ee7d4';
    CX.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 4);
    CX.lineWidth = 3;
    rr(b.x - 4, b.y - 4, b.w + 8, b.h + 8, 19); CX.stroke();
    CX.globalAlpha = 1;
  }
  // chunky drop + water window
  CX.fillStyle = '#b89ae8';
  rr(b.x, b.y + 3.5, b.w, b.h, 16); CX.fill();
  const wg = CX.createLinearGradient(0, b.y, 0, b.y + b.h);
  wg.addColorStop(0, '#5fc6f5'); wg.addColorStop(1, '#1256a5');
  CX.fillStyle = wg;
  rr(b.x, b.y, b.w, b.h, 16); CX.fill();
  CX.save();
  rr(b.x, b.y, b.w, b.h, 16); CX.clip();
  // sand
  CX.fillStyle = '#eed7a3';
  CX.beginPath();
  CX.moveTo(b.x, b.y + b.h - 9);
  CX.quadraticCurveTo(cx, b.y + b.h - 15, b.x + b.w, b.y + b.h - 7);
  CX.lineTo(b.x + b.w, b.y + b.h); CX.lineTo(b.x, b.y + b.h);
  CX.closePath(); CX.fill();
  // weed sprig
  CX.strokeStyle = '#2fae6e'; CX.lineWidth = 2.4; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(b.x + 10, b.y + b.h - 9);
  CX.quadraticCurveTo(b.x + 7 + Math.sin(G.t * 1.4) * 2, b.y + b.h - 19, b.x + 12, b.y + b.h - 26);
  CX.stroke();
  // your first fish lives on the tile (bobbing); a glyph before any fish exist
  const f = AQ.fish[0];
  const fy = cy - 2 + Math.sin(G.t * 1.6) * 2.5;
  if (f) {
    const sc = Math.min(1.15, 30 / PFFish.sizePx(f));
    PFFish.draw(CX, f, cx + 2, fy, G.t, 1, sc);
  } else {
    CX.fillStyle = 'rgba(255,255,255,0.9)';
    CX.beginPath(); CX.ellipse(cx + 3, fy, 9, 5.5, 0, 0, 7); CX.fill();
    CX.beginPath();
    CX.moveTo(cx - 5, fy); CX.lineTo(cx - 12, fy - 5); CX.lineTo(cx - 12, fy + 5);
    CX.closePath(); CX.fill();
    CX.fillStyle = '#1256a5';
    CX.beginPath(); CX.arc(cx + 7.5, fy - 1.5, 1.4, 0, 7); CX.fill();
  }
  // rising bubble
  CX.fillStyle = 'rgba(255,255,255,0.55)';
  const bb = (G.t * 9) % (b.h - 14);
  CX.beginPath(); CX.arc(b.x + b.w - 11, b.y + b.h - 8 - bb, 2.1, 0, 7); CX.fill();
  CX.restore();
  // glass frame
  CX.strokeStyle = '#ffffff'; CX.lineWidth = 2.5;
  rr(b.x, b.y, b.w, b.h, 16); CX.stroke();
  // food badge
  if (AQ.food > 0) {
    CX.fillStyle = '#5ee7d4';
    CX.strokeStyle = '#0a4f45'; CX.lineWidth = 1.5;
    CX.beginPath(); CX.arc(b.x + b.w - 3, b.y + 3, 10, 0, 7); CX.fill(); CX.stroke();
    CX.fillStyle = '#0a4f45';
    CX.font = fnt(800, 11); CX.textAlign = 'center';
    CX.fillText(AQ.food > 99 ? '99' : String(AQ.food), b.x + b.w - 3, b.y + 7);
  }
  // hunger warning takes the top-left corner: a fish is about to leave
  if (FISHCFG.lossOn && hungryCount()) {
    CX.save();
    CX.globalAlpha = 0.75 + 0.25 * Math.sin(G.t * 5);
    CX.fillStyle = '#ff5f7e';
    CX.strokeStyle = '#6d0f26'; CX.lineWidth = 1.5;
    CX.beginPath(); CX.arc(b.x + b.w / 2, b.y - 2, 10, 0, 7); CX.fill(); CX.stroke();
    CX.fillStyle = '#ffffff';
    CX.font = fnt(800, 13); CX.textAlign = 'center';
    CX.fillText('!', b.x + b.w / 2, b.y + 3);
    CX.restore();
  }
  // tank progress: the earned stars ride on the tile
  const st = tankStars();
  for (let i = 0; i < 3; i++) {
    const sx = b.x + 12 + i * 13, sy = b.y + b.h + 4;
    if (i < st) drawStar(sx, sy, 6, GOLD);
    else { CX.fillStyle = 'rgba(255,255,255,0.28)'; CX.beginPath(); CX.arc(sx, sy, 3, 0, 7); CX.fill(); }
  }
  CX.restore();
}

/* While a powerup is armed, every legal target breathes and everything else
   dims — so it is obvious what the tool can act on. */
function drawArmHighlights() {
  if (!G.arm || G.phase !== 'play') return;
  const targets = PF.powerTargets(G.state, G.arm);
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 6);
  const col = G.arm === 'catalyst' ? '#ffd23f' : '#9fd4ff';
  CX.save();
  for (const i of targets) {
    const sl = G.slots[i];

function drawHint(dt) {
  if (!G.hint) return;
  G.hintT += dt;
  if (G.hint.soft && G.hintT > 3.5) G.hint.soft = false;   // escalate to the arrow
  if (G.hintT > 9) { G.hint = null; G.idleT = 0; return; }
  const A = G.slots[G.hint.from], B = G.slots[G.hint.to];
  if (!A || !B) return;
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 6);
  if (G.hint.soft) {
    // gentle nudge first: the best-move flask breathes with a golden halo
    CX.save();
    CX.strokeStyle = '#ffe36a';
    CX.globalAlpha = 0.30 + pulse * 0.45;
    CX.lineWidth = 4;
    CX.shadowColor = '#ffd93d'; CX.shadowBlur = 14;
    rr(A.x - 9, A.y - 24, A.w + 18, A.h + 34, 12);
    CX.stroke();
    CX.restore();
    return;
  }
  for (const [s, col] of [[A, '#ffffff'], [B, '#ffd93d']]) {
    CX.save();
    CX.strokeStyle = col;
    CX.globalAlpha = 0.55 + pulse * 0.4;
    CX.lineWidth = 3;
    rr(s.x - 9, s.y - 24, s.w + 18, s.h + 34, 12);
    CX.stroke();
    CX.restore();
  }
  CX.save();
  CX.globalAlpha = 0.92;
  CX.strokeStyle = '#ffffff';
  CX.lineWidth = 4.5;
  CX.lineCap = 'round';
  CX.shadowColor = 'rgba(24,8,56,0.65)';
  CX.shadowBlur = 6;
  const ax = A.x + A.w / 2, ay = A.y - 28, bx = B.x + B.w / 2, by = B.y - 28;
  CX.beginPath(); CX.moveTo(ax, ay);
  CX.quadraticCurveTo((ax + bx) / 2, Math.min(ay, by) - 26, bx, by);
  CX.stroke();
  const angA = Math.atan2(by - (Math.min(ay, by) - 26), bx - (ax + bx) / 2);
  CX.beginPath();
  CX.moveTo(bx, by);
  CX.lineTo(bx - Math.cos(angA - 0.45) * 10, by - Math.sin(angA - 0.45) * 10);
  CX.moveTo(bx, by);
  CX.lineTo(bx - Math.cos(angA + 0.45) * 10, by - Math.sin(angA + 0.45) * 10);
  CX.stroke();
  CX.restore();
}

/* ---------- win screen ---------- */
function drawWin(dt) {

  CX.fillStyle = '#fff6ea';

    }

    CX.textAlign = 'left';

  wd.lines.forEach((l, i) => {
    if (G.winT < 0.9 + i * 0.18) return;

  // CTA row: [×2 AD] + COLLECT while uncollected and ads remain; else one button
